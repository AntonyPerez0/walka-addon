name: Virus scan

# Has VirusTotal check the files of a release - the very files people
# download, taken back from the release page - and puts the answer where
# they can see it: a "Virus scan" part in the release notes (each file, its
# result, a link to the full report, its SHA-256), and virus-scan.json next
# to the files, which is what the badge at the top of the README reads.
#
# It runs after every release (CI calls it), every Monday for the latest
# release, because scanners learn and a verdict changes with time, and by
# hand: Actions > Virus scan > Run workflow.
#
# It needs one thing set up once: a free VirusTotal API key (virustotal.com
# > sign up > your profile > API key) stored in this repository as the
# secret VT_API_KEY (Settings > Secrets and variables > Actions > New
# repository secret). Without it this does nothing, and says so.

on:
  workflow_call:
    inputs:
      tag:
        description: "The release to check"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check, for example v0.2.0 (leave empty for the latest one)"
        required: false
        default: ""
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: VirusTotal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Is there a VirusTotal key?
        id: key
        run: |
          if [ -n "$VT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No virus scan: this repository has no VT_API_KEY secret. Get a free API key from your VirusTotal profile and add it under Settings > Secrets and variables > Actions."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present
      - name: Fetch the files of the release
        if: steps.key.outputs.present
        run: |
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName --jq .tagName)"; fi
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::'$TAG' is not a release like v0.1.0"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --dir files --pattern Walka.exe --pattern Walka-addon.zip
          gh release view "$TAG" --json body --jq .body > notes.md
      - name: Have VirusTotal check them
        if: steps.key.outputs.present
        run: |
          echo "## $TAG" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/virus_scan.py files/Walka.exe files/Walka-addon.zip --badge virus-scan.json --notes notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Put the result with the release
        if: steps.key.outputs.present
        run: |
          gh release upload "$TAG" virus-scan.json --clobber
          gh release edit "$TAG" --notes-file notes.md
