name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version, for example 0.1.0 (leave empty to only run the tests and the build)"
        required: false
        default: ""

permissions:
  contents: read

# What goes into a release is fixed before the build starts:
# * Every action is named by the commit it is at, not by a tag: a tag can be
#   moved to other code by whoever holds the action's repository. (The
#   version that commit is stands next to it; .github/dependabot.yml
#   proposes newer ones.)
# * Python packages are installed from the lock files in companion/, which
#   name every package, its version and the checksums of its files. pip
#   refuses anything else (--require-hashes). Walka itself is not
#   "installed": the tests and the build take it from companion/src, so no
#   packaging tool that nobody pinned runs here either. One package is
#   published as source only (proxy_tools, which pywebview needs): pip
#   builds it where it installs it, and --build-constraint makes it take
#   the setuptools for that from the same lock file, checksum and all.

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes --build-constraint companion/requirements-dev.lock -r companion/requirements-dev.lock
      - name: Lint
        working-directory: companion
        run: ruff check src tests
      - name: Test
        # (-rs: a test that could not be run on this machine says why.
        # --durations: the fifteen slowest tests are named, with their
        # seconds - what is slow on one kind of machine only shows there.)
        run: python -m pytest -q -rs --durations=15

  windows-exe:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes --build-constraint companion/requirements-build.lock -r companion/requirements-build.lock
      - name: Build
        working-directory: companion
        run: python build_exe.py
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "companion/dist/Walka.exe").Path
          # Walka.exe is a windowed program: PowerShell does not wait for
          # one, nor take its exit code. So it is started, waited for and
          # read like this. (What it prints goes to files here; started
          # from a command prompt it writes to that prompt's window.)
          function Walka([string[]] $arguments) {
            $out = Join-Path $env:RUNNER_TEMP "walka-out.txt"
            $err = Join-Path $env:RUNNER_TEMP "walka-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
            $script:code = $p.ExitCode
            $text = ((Get-Content $out -Raw) + (Get-Content $err -Raw))
            Write-Host "> Walka.exe $arguments  (exit code $($script:code))"
            Write-Host $text
            return $text
          }
          $version = Walka "--version"
          if ($code -ne 0 -or $version -notmatch "walka \d+\.\d+") { throw "version check failed" }
          # Everything the frozen app imports only at run time (the Windows
          # Runtime modules behind Bluetooth, the screen capture backend,
          # what draws its window), the dashboard page and the bundled
          # addon. The runner has no Bluetooth adapter, so the scan below
          # stops before it would touch most of these: this is what
          # notices a module missing from the bundle.
          $check = Walka "selfcheck"
          if ($code -ne 0 -or $check -notmatch "selfcheck OK") { throw "selfcheck failed: something the app needs at run time is missing from Walka.exe" }
          # The licences of the libraries packed into the program go with it.
          $licences = Walka "licenses"
          foreach ($wanted in "THIRD-PARTY SOFTWARE IN WALKA", "Apache License", "aiohttp", "winrt-runtime", "pywebview", "pythonnet", "Microsoft.Web.WebView2") {
            if ($licences -notmatch [regex]::Escape($wanted)) { throw "Walka.exe does not carry the licences of what is packed into it: nothing about $wanted" }
          }
          # The Bluetooth stack must load inside the frozen app. The runner
          # has no Bluetooth adapter, so the scan itself is expected to say
          # so (and exit 2) - what must not happen is an import error.
          $scan = Walka "scan", "--seconds", "2"
          if ($scan -match "ModuleNotFoundError|ImportError|AttributeError|Traceback") { throw "Bluetooth stack did not load in the frozen app" }

          # Now as it is used: started with nothing but the demo's switch,
          # it opens its window. The page must load in it, the simulated
          # walk must be recorded, and closing the window must end the
          # program by itself, with the walk saved.
          $env:WALKA_DATA_DIR = Join-Path $env:RUNNER_TEMP "walka-data"
          $log = Join-Path $env:WALKA_DATA_DIR "walka.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--demo","--port","8791" -PassThru
          $closed = $false
          try {
            $state = $null
            foreach ($i in 1..60) {
              Start-Sleep -Milliseconds 500
              try { $state = Invoke-RestMethod "http://127.0.0.1:8791/api/state"; if ($state.treadmill.speed_kmh -gt 0) { break } } catch { }
            }
            if (-not $state) { throw "the dashboard API did not come up" }
            # (The demo has a made-up walker who presses start on the
            # simulated pad's remote: the companion itself cannot.)
            if ($state.treadmill.speed_kmh -le 0) { throw "the demo's walker never got the simulated belt moving" }
            if (-not $state.session) { throw "the walk on the simulated pad is not being recorded" }
            Write-Host "belt speed $($state.treadmill.speed_kmh) km/h, recording a walk filed under: $($state.session.source)"
            $loaded = $false
            foreach ($i in 1..120) {
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern "the dashboard is loaded in Walka's window" -Quiet)) { $loaded = $true; break }
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $loaded) { throw "Walka's window did not come up with the dashboard in it" }
            if (-not (Select-String -Path $log -Pattern "drawn by edgechromium" -Quiet)) { throw "the window is not drawn by Edge WebView2" }
            # (Packed into one file, Walka.exe is two processes: the one
            # started here unpacks the program and waits for the other,
            # which is the program - and has the window.)
            $inner = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id) AND Name = 'Walka.exe'" | Select-Object -First 1
            if (-not $inner) { throw "Walka.exe is not running the way a one-file program does" }
            $window = Get-Process -Id $inner.ProcessId
            foreach ($i in 1..20) {
              $window.Refresh()
              if ($window.MainWindowTitle) { break }
              Start-Sleep -Milliseconds 500
            }
            Write-Host "window: '$($window.MainWindowTitle)'"
            if ($window.MainWindowTitle -ne "Walka") { throw "the window on screen is not Walka's" }
            # What the X in its corner does.
            if (-not $window.CloseMainWindow()) { throw "the window could not be asked to close" }
            if (-not $proc.WaitForExit(30000)) { throw "Walka did not end when its window was closed" }
            $closed = $true
            if ($proc.ExitCode -ne 0) { throw "Walka did not stop in an orderly way when its window was closed (exit code $($proc.ExitCode))" }
            if (-not (Test-Path (Join-Path $env:WALKA_DATA_DIR "config.json"))) { throw "Walka did not get to the end of its shutdown" }
            if (Test-Path (Join-Path $env:WALKA_DATA_DIR "active-session.json")) { throw "the walk was not saved when the window was closed" }
          } finally {
            if (-not $closed) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $log) { Write-Host "--- walka.log"; Get-Content $log }
          }
          $global:LASTEXITCODE = 0
      # Walka.exe is a windowed program, and Windows gives one no console.
      # Its commands ("Walka.exe probe") print all the same, to the command
      # prompt they are typed into: checked on a real one.
      - name: Commands print to the command prompt
        run: python tools/check_console.py companion/dist/Walka.exe
      # Walka.exe makes HTTPS requests on a computer where somebody has
      # signed in to a Walka account - and on no build machine, where
      # nobody ever is. So what it asks with is tried here by itself: the
      # packed program fetches https://walka.dev/ once, which must work,
      # and then asks a server started here whose certificate nobody
      # vouches for: that one it must turn down before it has asked
      # anything. (If walka.dev cannot be reached from this machine, the
      # build fails: nothing was checked.)
      - name: HTTPS works in the program, and it checks certificates
        run: python tools/check_https.py companion/dist/Walka.exe
      # Walka can sign in to a Walka account and send walks to it, and
      # the program built here has that part - made with the address that
      # is built into it, and with no other. So it is started twice, each
      # time with the two variables set that name another address to a
      # Walka run from its source code. As people start it - a real
      # treadmill asked for - it must have the part, with nobody signed
      # in and sending off, not made with that other address, and must
      # have written no file of a Walka account. As the demo it must say
      # nothing of a Walka account and answer none of its buttons: a
      # made-up walk never goes. Nobody is signed in on this machine, so
      # the accounts are asked nothing. (tools/check_account_part.py says
      # how; what it sets, it sets for those runs. This machine has no
      # Bluetooth adapter and no treadmill: Walka serves its dashboard
      # while it looks.)
      - name: The program has its Walka account's part, and none as the demo
        run: python tools/check_account_part.py companion/dist/Walka.exe
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item companion/dist/Walka.exe release/
          Copy-Item -Recurse Walka release/Walka
          # The addon's zip is made from this folder: the licence and the
          # disclaimer go with it to wherever the addon is passed on.
          Copy-Item LICENSE, DISCLAIMER.md release/Walka/
          Copy-Item README.md release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Walka-windows
          path: release/
          if-no-files-found: error

  # The same program for a Mac: an application, "Walka", in a zip (an
  # application is a folder: a zip is how one is downloaded). PyInstaller
  # builds for the processor it runs on, so there are two: Apple silicon
  # and Intel.
  mac-app:
    name: Mac program (${{ matrix.chip }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, chip: Apple silicon, machine: arm64, file: Walka-mac-apple-silicon }
          - { os: macos-15-intel, chip: Intel, machine: x86_64, file: Walka-mac-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --require-hashes --build-constraint companion/requirements-build.lock -r companion/requirements-build.lock
      - name: Build
        working-directory: companion
        run: python build_exe.py
      - name: Smoke test
        run: |
          app=companion/dist/Walka.app
          exe="$app/Contents/MacOS/Walka"
          fail() { echo "::error::$1"; exit 1; }
          # Built for the processor it is named after?
          file "$exe"
          file "$exe" | grep -q "${{ matrix.machine }}" || fail "Walka was not built for ${{ matrix.machine }}"
          # An application macOS will run and can ask about: signed (ad
          # hoc) after its Info.plist was written, with the sentence macOS
          # shows when it asks about Bluetooth - a program that touches
          # Bluetooth without one is ended on the spot.
          codesign --verify --deep --strict "$app" || fail "the application's signature does not hold"
          plutil -p "$app/Contents/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$app/Contents/Info.plist" | grep -q "listens to your walking pad" || fail "the application does not say what it wants Bluetooth for"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' companion/pyproject.toml)
          [ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version" ] || fail "the application does not carry Walka's version ($version)"
          "$exe" --version || fail "version check failed"
          # Everything the frozen app imports only at run time (the
          # CoreBluetooth modules behind Bluetooth, the screen capture
          # backend, what it asks macOS, what draws its window), the
          # dashboard page and the bundled addon.
          "$exe" selfcheck || fail "selfcheck failed: something the app needs at run time is missing from Walka"
          # The licences of the libraries packed into the program go with it.
          "$exe" licenses > "$RUNNER_TEMP/licences.txt" || fail "Walka does not print the licences of what is packed into it"
          for wanted in "THIRD-PARTY SOFTWARE IN WALKA" "Apache License" "aiohttp" "pyobjc-core" "pywebview"; do
            grep -q "$wanted" "$RUNNER_TEMP/licences.txt" || fail "the licences packed into Walka do not mention: $wanted"
          done
          # The Bluetooth stack must load inside the frozen app. Whether
          # this machine lets it scan is another matter - what must not
          # happen is an import error.
          scan=$("$exe" scan --seconds 2 2>&1 || true)
          echo "$scan"
          if echo "$scan" | grep -Eq "ModuleNotFoundError|ImportError|AttributeError|Traceback"; then
            fail "Bluetooth stack did not load in the frozen app"
          fi
          # Now as it is used: started with nothing but the demo's switch,
          # it opens its window.
          export WALKA_DATA_DIR="$RUNNER_TEMP/walka-data"
          log="$WALKA_DATA_DIR/walka.log"
          "$exe" --demo --port 8791 &
          pid=$!
          giveup() { kill -9 $pid 2>/dev/null; echo "--- walka.log"; cat "$log" 2>/dev/null; fail "$1"; }
          state=""
          for i in $(seq 1 60); do
            sleep 0.5
            state=$(curl -fsS http://127.0.0.1:8791/api/state 2>/dev/null || true)
            speed=$(echo "$state" | python3 -c 'import json, sys; print(json.load(sys.stdin)["treadmill"]["speed_kmh"])' 2>/dev/null || echo 0)
            if python3 -c "import sys; sys.exit(0 if float('$speed') > 0 else 1)"; then break; fi
          done
          [ -n "$state" ] || giveup "the dashboard API did not come up"
          # (The demo has a made-up walker who presses start on the
          # simulated pad's remote: the companion itself cannot.)
          python3 -c "import sys; sys.exit(0 if float('$speed') > 0 else 1)" || giveup "the demo's walker never got the simulated belt moving"
          curl -fsS -o /dev/null http://127.0.0.1:8791/ || giveup "dashboard page missing from the bundle"
          echo "$state" | python3 -c 'import json, sys; s = json.load(sys.stdin); print("belt speed", s["treadmill"]["speed_kmh"], "km/h, recording a walk filed under:", s["session"]["source"])' || giveup "the walk on the simulated pad is not being recorded"
          # The page must load in the window.
          for i in $(seq 1 120); do
            grep -q "the dashboard is loaded in Walka's window" "$log" 2>/dev/null && break
            kill -0 $pid 2>/dev/null || break
            sleep 0.5
          done
          grep -q "the dashboard is loaded in Walka's window" "$log" 2>/dev/null || giveup "Walka's window did not come up with the dashboard in it"
          grep -q "drawn by wkwebview" "$log" || giveup "the window is not drawn by WebKit"
          # Told to end from outside - as at a log-out that does not wait -
          # the walk must be saved and the program must end by itself,
          # window and all, not be killed.
          kill -TERM $pid
          code=0
          wait $pid || code=$?
          echo "--- walka.log"; cat "$log"
          [ "$code" -eq 0 ] || fail "Walka did not stop in an orderly way when it was told to (exit code $code)"
          [ -f "$WALKA_DATA_DIR/config.json" ] || fail "Walka did not get to the end of its shutdown"
          [ ! -f "$WALKA_DATA_DIR/active-session.json" ] || fail "the walk was not saved"
      # HTTPS in the packed program, as for Windows above. A Mac's Python
      # brings no root certificates with it, and a packed one would look
      # for them where this machine's Python keeps its own: Walka reads
      # macOS's own list instead, and says here how many it found there.
      - name: HTTPS works in the program, and it checks certificates
        run: python tools/check_https.py companion/dist/Walka.app/Contents/MacOS/Walka
      # The Walka account's part in the packed program, as for Windows
      # above: started once with a real treadmill asked for and once as
      # the demo, each time with the two variables set that a packed
      # program must not read. (Whether this machine lets it use
      # Bluetooth is another matter: it serves its dashboard all the same.)
      - name: The program has its Walka account's part, and none as the demo
        run: python tools/check_account_part.py companion/dist/Walka.app/Contents/MacOS/Walka
      - name: Package
        run: |
          mkdir -p release
          # (ditto: the zip Finder itself would make of an application - what
          # is a link inside it stays a link, and what may be run stays so.)
          ditto -c -k --keepParent companion/dist/Walka.app "release/${{ matrix.file }}.zip"
          unzip -Z "release/${{ matrix.file }}.zip" | tail -n 3
          # ... and it comes out of the zip as an application that still runs.
          mkdir "$RUNNER_TEMP/unzipped" && ditto -x -k "release/${{ matrix.file }}.zip" "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict "$RUNNER_TEMP/unzipped/Walka.app" || { echo "::error::the application does not survive its zip"; exit 1; }
          "$RUNNER_TEMP/unzipped/Walka.app/Contents/MacOS/Walka" selfcheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.file }}
          path: release/
          if-no-files-found: error

  # Everything that is about to be published - Walka.exe, the Mac programs
  # and the addon's files - is scanned for viruses before it is.
  virus-scan:
    name: Virus scan
    needs: [windows-exe, mac-app]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Walka-windows
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Walka-mac-*
          path: release
          merge-multiple: true
      # Microsoft Defender - the antivirus that is part of Windows, the one
      # most people who download Walka have - is on this machine. It scans
      # what is about to be published: Walka.exe, the Mac programs (as the
      # zips they are published as, and unpacked) and the addon's files. If
      # it finds anything this job fails, and a release needs this job, so
      # nothing is published. What it found (nothing), when, and with which
      # virus definitions goes into virus-scan.json, which is published
      # with the release: the badge at the top of the README reads it.
      - name: Virus scan (Microsoft Defender)
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { throw "Microsoft Defender is not on this machine" }
          # Today's virus definitions. If they cannot be fetched, the ones
          # on the machine are used, and virus-scan.json says how old they are.
          & $mp -SignatureUpdate | Out-Host
          # -DisableRemediation: only look and report. It also makes the
          # scan ignore the folders this machine is set up to skip (all of
          # them: C:\ and D:\) and look inside archives.
          function Scan($path) {
            $text = (& $mp -Scan -ScanType 3 -File $path -DisableRemediation 2>&1 | Out-String)
            Write-Host $text
            [pscustomobject]@{ Code = $LASTEXITCODE; Text = $text }
          }
          # First, is the scanner awake? It must catch the test file that
          # every antivirus is meant to catch (EICAR: harmless, 68 letters).
          # Written in two halves, so that this file is not one itself.
          $test = Join-Path $env:RUNNER_TEMP "scanner-test"
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          [IO.File]::WriteAllText((Join-Path $test "eicar.com"), 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' + 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*')
          $r = Scan $test
          if ($r.Code -ne 2 -or $r.Text -notmatch "EICAR") { throw "Microsoft Defender did not catch the test file, so a scan by it would say nothing" }
          Remove-Item -Recurse -Force $test
          # Then the files of the release.
          $macs = @(Get-ChildItem release -Filter "Walka-mac-*.zip")
          if (-not (Test-Path release/Walka.exe) -or $macs.Count -ne 2) { throw "the files of the release are not all here" }
          $r = Scan (Resolve-Path release).Path
          if ($r.Code -ne 0 -or $r.Text -notmatch "found no threats") { throw "Microsoft Defender flags a file of the release (see above). Nothing is published." }
          # ... and the Mac programs once more, out of their zips.
          $unpacked = Join-Path $env:RUNNER_TEMP "mac-programs"
          foreach ($zip in $macs) { Expand-Archive $zip.FullName -DestinationPath (Join-Path $unpacked $zip.BaseName) }
          $r = Scan $unpacked
          if ($r.Code -ne 0 -or $r.Text -notmatch "found no threats") { throw "Microsoft Defender flags a Mac program of the release (see above). Nothing is published." }
          $sha256 = [ordered]@{}
          foreach ($name in @("Walka.exe") + @($macs | ForEach-Object { $_.Name })) {
            $sha256[$name] = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLower()
          }
          $status = Get-MpComputerStatus
          $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          [ordered]@{
            badge = "Microsoft Defender found nothing on $today"
            scanner = "Microsoft Defender"
            result = "no threats found"
            scanned = $today
            files = @("Walka.exe") + @($macs | ForEach-Object { $_.Name }) + @("the files of the addon (Walka-addon.zip)")
            virus_definitions = "$($status.AntivirusSignatureVersion)"
            virus_definitions_from = $status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString("yyyy-MM-dd")
            engine = "$($status.AMEngineVersion)"
            walka_exe_sha256 = $sha256["Walka.exe"]
            sha256 = $sha256
          } | ConvertTo-Json | Set-Content -Encoding utf8 release/virus-scan.json
          Get-Content release/virus-scan.json
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Walka-release
          path: release/
          if-no-files-found: error

  # Publishes a release: the programs people download from the buttons at
  # the top of the README (Walka.exe for Windows, a zip for each kind of
  # Mac), and the addon as a zip that is ready to upload to CurseForge. Two ways to ask for one: push a version tag (v0.1.0), or
  # run this workflow by hand (Actions > CI > Run workflow) and type the
  # version - the tag is then made here. Either way only after the tests
  # and the build above have passed for that same commit.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [test, virus-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the signed statement that this run built these files (below).
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.release_version) || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the version written in the code
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::'$TAG' is not a version like v0.1.0"; exit 1; }
          # Run by hand, a release is made from the main line of the code and from nowhere else.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::A release is published from the branch '$DEFAULT_BRANCH', not from '$GITHUB_REF_NAME'. Choose it under 'Use workflow from'."
            exit 1
          fi
          version="${TAG#v}"
          fail() { echo "::error::tag $TAG does not match $1"; exit 1; }
          grep -qx "version = \"$version\"" companion/pyproject.toml || fail "version in companion/pyproject.toml"
          grep -qx "__version__ = \"$version\"" companion/src/walka/__init__.py || fail "__version__ in companion/src/walka/__init__.py"
          grep -qx "## Version: $version" Walka/Walka.toc || fail "## Version in Walka/Walka.toc"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Walka-release
          path: release
      - name: Pack the addon
        working-directory: release
        run: zip -r -q ../Walka-addon.zip Walka
      # The checksums of everything people download, in one file: a download
      # can be compared with it (sha256sum -c, or Get-FileHash on Windows).
      - name: Checksums
        run: |
          mkdir assets
          cp release/Walka.exe release/Walka-mac-apple-silicon.zip release/Walka-mac-intel.zip release/virus-scan.json Walka-addon.zip assets/
          (cd assets && sha256sum Walka.exe Walka-mac-apple-silicon.zip Walka-mac-intel.zip Walka-addon.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # The files that were scanned are the files that are published.
          for name in Walka.exe Walka-mac-apple-silicon.zip Walka-mac-intel.zip; do
            scanned=$(python3 -c 'import json, sys; print(json.load(open("assets/virus-scan.json", encoding="utf-8-sig"))["sha256"][sys.argv[1]])' "$name")
            grep -q "^$scanned  $name\$" assets/SHA256SUMS.txt || { echo "::error::$name is not the file the virus scan saw"; exit 1; }
          done
      # A statement, signed by GitHub and kept in a public log, that this
      # run of this workflow, from this commit, produced exactly these
      # files. Anyone can check a download against it:
      #   gh attestation verify Walka.exe --repo <this repository>
      - name: Say where these files were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/Walka.exe
            assets/Walka-mac-apple-silicon.zip
            assets/Walka-mac-intel.zip
            assets/Walka-addon.zip
      - name: Publish
        run: |
          files="assets/Walka.exe assets/Walka-mac-apple-silicon.zip assets/Walka-mac-intel.zip assets/Walka-addon.zip assets/virus-scan.json assets/SHA256SUMS.txt"
          for file in $files; do test -s "$file" || { echo "::error::$file is missing"; exit 1; }; done
          notes="**To get Walka on Windows:** under **Assets** below, click **Walka.exe**, then open it. If Windows says *Windows protected your PC*, click **More info**, then **Run anyway**. The steps are at the top of the [README](https://github.com/$GH_REPO#readme).

          **On a Mac:** click **Walka-mac-apple-silicon.zip** (Macs from late 2020 on) or **Walka-mac-intel.zip** (older ones), open the zip, then open the **Walka** application that is in it. The first time, macOS will not open it until you allow it under *System Settings > Privacy & Security > Open Anyway*: see [On a Mac](https://github.com/$GH_REPO/blob/$TAG/docs/INSTALL.md#on-a-mac). The Mac version is new and has not been tried with the game on a real Mac yet.

          **Early version:** checked on one walking pad so far - a UREVO Strol 2E (URTM030) with Windows 11. Every other treadmill is untried. Read [Before your first walk](https://github.com/$GH_REPO/blob/$TAG/docs/INSTALL.md#before-your-first-walk).

          **Walka only listens to your treadmill:** it cannot start, stop or change the speed of the belt - you set the speed on the treadmill itself. Walking while you play is at your own risk; Walka comes with no warranty and is not a medical device. Read the [disclaimer](https://github.com/$GH_REPO/blob/$TAG/DISCLAIMER.md) before your first walk.

          **Your Walka account (on walka.dev):** optional. Walka works in full without it, and if you never sign in it sends nothing and asks nobody. If you sign in and switch sending on yourself, each walk goes to your Walka account. What is sent, when, and how to stop: [Your Walka account](https://github.com/$GH_REPO/blob/$TAG/docs/WALKA-ACCOUNT.md#your-walka-account-on-walkadev).

          **Virus scan:** before this was published, Microsoft Defender scanned Walka.exe, the Mac programs and the addon's files, and found nothing. *virus-scan.json* under Assets says when, and with which virus definitions. A scan that finds nothing is not proof that a file is harmless: see [Is the download safe?](https://github.com/$GH_REPO#is-the-download-safe)

          **Is this the file that was built here?** *SHA256SUMS.txt* has the checksum of every download. GitHub also keeps a signed record that these files were built by this repository's workflow from this version of the code: \`gh attestation verify Walka.exe --repo $GH_REPO\` checks a download against it. The files of a published release are never replaced.

          **Walka-addon.zip** is the game addon on its own. Walka.exe can put it in the game for you; to do it by hand, unzip it into the game's Interface\\AddOns folder. The Source code files are for developers."
          # A tag like v0.2.0-rc1 is a trial: published, but never "the latest" that the README's button gives.
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            # A second run for the same tag. A published release is never
            # changed: people may have downloaded its files, checked them,
            # or be comparing a download with its checksums right now.
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published, and a published release is never changed. Give the fix a new version number and publish that."
              exit 1
            fi
            # A draft that a failed first try left behind: finish it.
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --draft=false
          else
            # From a pushed tag: the tag must be there. Run by hand: the tag is made now, on this commit.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then at="--verify-tag"; else at="--target $GITHUB_SHA"; fi
            gh release create "$TAG" $files $at --title "Walka ${TAG#v}" --notes "$notes" $pre || {
              echo "::error::The release was refused. If the message above is 'Resource not accessible by integration': GitHub does not let a workflow put a tag on a commit that itself changes a file under .github/workflows. Make any other commit on top of it and run this again."
              exit 1
            }
          fi
