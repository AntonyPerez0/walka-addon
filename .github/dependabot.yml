# The actions the build uses are pinned to exact commits (see ci.yml). This
# has GitHub propose newer versions of them, so that the pins do not rot:
# GitHub retires old versions of its actions, and a build pinned to one
# then stops on the day it is needed. Once a month, and all of them in one
# pull request, which runs the tests and the builds: green means merge.
#
# The Python packages are not here: Dependabot does not read the lock files
# (companion/requirements-*.lock). .github/workflows/advisories.yml asks
# OSV.dev about every version pinned in them, every week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "CI"
