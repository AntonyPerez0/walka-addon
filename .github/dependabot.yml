# The actions the build uses are pinned to exact commits (see ci.yml). This
# has GitHub propose the pull request when a newer version of one is out,
# so that the pins do not rot. A pull request runs the tests and the build.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
