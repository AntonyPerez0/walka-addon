[pytest]
# One command for everything: `python -m pytest` from the repository root
# runs the companion's tests and the addon's (tests/addon, which load the
# Lua addon into a mock WoW client).
testpaths =
    companion/tests
    tests/addon
# The companion package is tested from its source tree.
pythonpath = companion/src
# pytest-asyncio (used by the companion's tests): its future default, set
# explicitly so that it does not warn on every run.
asyncio_default_fixture_loop_scope = function
