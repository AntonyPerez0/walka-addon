<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walka demo</title>
<!--
  Walka in 3D: a walking pad under a standing desk, the Walka dashboard on
  the upright monitor and a game on the other. Everything is drawn here, in
  three.js - no models or pictures are loaded.

  Open this file in a browser (it fetches three.js from a CDN).
    ?record   - no clock of its own: tools/record_demo.mjs steps it frame by frame
    ?t=12     - start at second 12
-->
<style>
  :root {
    --ink: #f1f3f6;
    --ink-2: #b9c0cb;
    --panel: rgba(11, 13, 16, 0.78);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #6da7ec;
    --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0d10;
    color: var(--ink);
    font-family: var(--font);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .brand {
    position: fixed; top: 20px; left: 20px;
    padding: 6px 14px 6px 6px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 20px; letter-spacing: 0.2px;
  }
  .brand svg { width: 32px; height: 32px; border-radius: 8px; }
  .brand small { font-weight: 400; color: var(--ink-2); font-size: 14px; margin-left: 4px; }

  .timelapse {
    position: fixed; top: 24px; right: 24px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2); opacity: 0;
  }
  .timelapse b { color: var(--ink); font-weight: 600; }

  .caption {
    position: fixed; left: 50%; bottom: 7%;
    transform: translateX(-50%);
    max-width: min(880px, calc(100% - 48px));
    box-sizing: border-box;
    padding: 14px 22px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(6px);
    font-size: clamp(15px, 2.1vw, 22px);
    line-height: 1.35;
    text-align: center;
    opacity: 0;
  }
  .caption b { color: #fff; }
  .caption .sub { display: block; font-size: 0.72em; color: var(--ink-2); margin-top: 4px; }

  .endcard {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(11,13,16,.82), rgba(11,13,16,.96));
    opacity: 0; pointer-events: none; text-align: center; padding: 24px;
  }
  .endcard svg { width: 84px; height: 84px; border-radius: 20px; }
  .endcard h1 { margin: 0; font-size: clamp(30px, 5vw, 54px); font-weight: 650; }
  .endcard p { margin: 0; color: var(--ink-2); font-size: clamp(14px, 2vw, 20px); max-width: 720px; }
  .endcard p.small { font-size: clamp(12px, 1.5vw, 15px); opacity: .85; }

  .controls {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 8px;
  }
  .controls button {
    font: 500 13px var(--font);
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button[aria-pressed="true"] { background: #13233a; border-color: var(--accent); }
  body.record .controls { display: none; }

  @media (max-width: 600px) {
    .brand { top: 14px; left: 16px; font-size: 17px; }
    .brand small { display: none; }
    .timelapse { top: 16px; right: 16px; }
    .caption { bottom: 72px; padding: 10px 14px; }
    .controls { left: 16px; right: 16px; justify-content: center; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="brand" aria-hidden="true">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#256abf"/><path d="M8.2 15.6 12.4 8l3.6 5.6L19.6 9l4.2 6.6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="20" width="20" height="4.6" rx="2.3" fill="#fff" fill-opacity=".55"/></svg>
  Walka <small>walk while you play</small>
</div>
<div class="timelapse" id="timelapse">Walk numbers sped up <b>×60</b></div>
<div class="caption" id="caption" role="status" aria-live="polite"></div>

<div class="endcard" id="endcard">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#256abf"/><path d="M8.2 15.6 12.4 8l3.6 5.6L19.6 9l4.2 6.6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="20" width="20" height="4.6" rx="2.3" fill="#fff" fill-opacity=".55"/></svg>
  <h1>Walka</h1>
  <p>Free for Windows and Mac, with an addon for World of Warcraft.<br>Steps, miles and calories - filed under the character you play.</p>
  <p class="small">Walka only listens to your treadmill. Walking while you play is at your own risk.</p>
</div>

<div class="controls">
  <button type="button" id="play" aria-pressed="false">Pause</button>
  <button type="button" id="free" aria-pressed="false" title="Drag to look around, scroll to zoom">Look around</button>
  <button type="button" id="restart">Restart</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const RECORD = params.has('record');
if (RECORD) document.body.classList.add('record');

const DURATION = 31;           // seconds in one run of the demo
const FONT = '"Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif';

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// a seeded random, so every frame of every run is the same
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function canvasTexture(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  if (opts.repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(...opts.repeat); }
  tex.userData = { canvas: c, ctx: g };
  return tex;
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0, ...o });

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = null, rounded = 0) {
  const geo = rounded ? new RoundedBoxGeometry(w, h, d, 3, rounded) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

// ------------------------------------------------------------ the timeline
// Belt speed in mph, as the treadmill reports it. Walka never sets it: the
// walker does, with the pad's own remote (see the left hand, below).
function beltMph(t) {
  if (t < 5.2) return 0;
  if (t < 8.2) return 1.5 * smooth(5.2, 8.2, t);
  if (t < 12.6) return 1.5;
  if (t < 13.8) return lerp(1.5, 2.0, smooth(12.6, 13.8, t));
  if (t < 22.6) return 2.0;
  if (t < 25.4) return 2.0 * (1 - smooth(22.6, 25.4, t));
  return 0;
}
// When the left hand goes to the remote: [start, press, back]
const REMOTE_PRESSES = [[3.9, 4.9, 5.9], [11.6, 12.5, 13.4], [21.5, 22.4, 23.3]];
// Walk numbers run 60 times faster in the middle of the demo (said on screen).
const timeRate = t => 1 + 59 * (smooth(8.6, 9.4, t) - smooth(22.0, 22.6, t));

const CAPTIONS = [
  [0.4, 4.2, 'A walking pad under a standing desk - <b>and a game on the screen</b>.'],
  [4.4, 8.6, '<b>Start the belt with the treadmill\'s own remote.</b>', 'Walka cannot start, stop or change the belt - it only listens.'],
  [8.9, 14.6, 'Walka hears the pad over Bluetooth and <b>records the walk</b>:', 'time, distance, steps and calories, live on the dashboard.'],
  [14.9, 20.6, '<b>Play as usual.</b> The walk counts for the character you are playing.', 'A small floating window sits over the game, if you want it.'],
  [20.9, 25.8, 'Done for now? <b>Stop the belt at the treadmill.</b>', 'Keep its remote within reach - stopping is yours.'],
  [26.0, 28.4, 'Walka <b>saves the walk</b>, under your character.'],
];

// --------------------------------------------------------------- renderer
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: RECORD });
renderer.setPixelRatio(RECORD ? 1 : Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1614);
const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.05, 60);

// ------------------------------------------------------------------- room
// Back wall is the plane z = 0, left wall is x = -1.6, floor is y = 0.
const ROOM = { left: -1.6, right: 3.6, depth: 5 };
const room = new THREE.Group();
scene.add(room);

const carpetTex = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = '#c9b7a3'; g.fillRect(0, 0, w, h);
  const r = rng(7);
  for (let i = 0; i < 26000; i++) {
    const v = 150 + r() * 70 | 0;
    g.fillStyle = `rgba(${v + 30},${v + 14},${v - 6},${0.25 + r() * 0.3})`;
    g.fillRect(r() * w, r() * h, 1 + r() * 1.6, 1 + r() * 1.6);
  }
}, { repeat: [7, 7] });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.right - ROOM.left, ROOM.depth),
  std(0xffffff, { map: carpetTex, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set((ROOM.left + ROOM.right) / 2, 0, ROOM.depth / 2);
floor.receiveShadow = true;
room.add(floor);

const wallMat = std(0xead9d1, { roughness: 0.95 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.right - ROOM.left, 2.7), wallMat);
backWall.position.set((ROOM.left + ROOM.right) / 2, 1.35, 0);
backWall.receiveShadow = true;
room.add(backWall);
const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.depth, 2.7), wallMat);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(ROOM.left, 1.35, ROOM.depth / 2);
leftWall.receiveShadow = true;
room.add(leftWall);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.right - ROOM.left, ROOM.depth), std(0xf3ebe6));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set((ROOM.left + ROOM.right) / 2, 2.7, ROOM.depth / 2);
room.add(ceiling);

// baseboards, the white cable channel and the outlet
const white = std(0xf4f1ec, { roughness: 0.6 });
box(ROOM.right - ROOM.left, 0.09, 0.015, white, (ROOM.left + ROOM.right) / 2, 0.045, 0.008, room);
box(0.015, 0.09, ROOM.depth, white, ROOM.left + 0.008, 0.045, ROOM.depth / 2, room);
box(0.03, 0.12, 0.08, white, ROOM.left + 0.015, 0.36, 2.3, room);
box(0.02, 0.025, 1.6, white, ROOM.left + 0.01, 0.42, 1.45, room);
{
  const cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
    V(ROOM.left + 0.02, 0.36, 2.3), V(ROOM.left + 0.07, 0.2, 2.2), V(ROOM.left + 0.12, 0.012, 1.9), V(-1.0, 0.012, 1.2), V(-0.8, 0.012, 0.9)]), 40, 0.006, 6), white);
  room.add(cable);
}

// curtain, on the left wall nearest the viewer
{
  const geo = new THREE.PlaneGeometry(1.3, 2.45, 60, 1);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setZ(i, Math.sin(p.getX(i) * 22) * 0.025 + Math.sin(p.getX(i) * 7) * 0.012);
  geo.computeVertexNormals();
  const curtain = new THREE.Mesh(geo, std(0xe3cfb9, { roughness: 1, side: THREE.DoubleSide }));
  curtain.rotation.y = Math.PI / 2;
  curtain.position.set(ROOM.left + 0.07, 1.3, 3.75);
  curtain.receiveShadow = true;
  room.add(curtain);
}

// three posters on the left wall: made-up art, drawn here
function poster(draw, z) {
  const tex = canvasTexture(256, 360, draw);
  const frame = box(0.012, 0.66, 0.47, std(0x111111), ROOM.left + 0.006, 1.86, z, room);
  frame.castShadow = false;
  const art = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.64), std(0xffffff, { map: tex, roughness: 0.5 }));
  art.rotation.y = Math.PI / 2;
  art.position.set(ROOM.left + 0.014, 1.86, z);
  room.add(art);
}
poster((g, w, h) => { // night, moon, mountains
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b2233'); gr.addColorStop(1, '#2e5d62');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e8f1e0'; g.beginPath(); g.arc(178, 92, 34, 0, 7); g.fill();
  const r = rng(3); g.fillStyle = '#cfe6df';
  for (let i = 0; i < 60; i++) g.fillRect(r() * w, r() * h * 0.5, 1.5, 1.5);
  g.fillStyle = '#16343b'; g.beginPath(); g.moveTo(0, 250); g.lineTo(70, 170); g.lineTo(130, 230); g.lineTo(200, 150); g.lineTo(256, 210); g.lineTo(256, 360); g.lineTo(0, 360); g.fill();
  g.fillStyle = '#0a1a1f'; g.beginPath(); g.moveTo(0, 300); g.lineTo(90, 245); g.lineTo(170, 290); g.lineTo(256, 260); g.lineTo(256, 360); g.lineTo(0, 360); g.fill();
}, 0.62);
poster((g, w, h) => { // red sunset city
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#f17c78'); gr.addColorStop(0.7, '#c9343d'); gr.addColorStop(1, '#5c1220');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,220,200,.55)'; g.beginPath(); g.arc(128, 150, 46, 0, 7); g.fill();
  const r = rng(11); g.fillStyle = '#7a1c2a';
  for (let x = 0; x < w; x += 14) { const hh = 40 + r() * 90; g.fillRect(x, 300 - hh, 12, hh + 60); }
  g.fillStyle = '#3a0b14'; g.fillRect(0, 300, w, 60);
}, 1.28);
poster((g, w, h) => { // dark, with an orange sun mark
  g.fillStyle = '#121214'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#e2541c'; g.lineWidth = 6; g.fillStyle = '#e2541c';
  g.beginPath(); g.arc(128, 170, 44, 0, 7); g.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.beginPath(); g.moveTo(128 + Math.cos(a) * 58, 170 + Math.sin(a) * 58); g.lineTo(128 + Math.cos(a) * 84, 170 + Math.sin(a) * 84); g.stroke(); }
  g.beginPath(); g.arc(128, 170, 16, 0, 7); g.fill();
}, 1.94);

// shelves with little things on them
function shelf(x, y, z, w, color, items) {
  const s = box(w, 0.025, 0.16, std(color), x, y, z + 0.08, room);
  items(s);
  return s;
}
shelf(-0.55, 2.2, 0, 0.5, 0x1b1b1b, () => {
  box(0.26, 0.32, 0.05, std(0x253a2b, { roughness: 0.5 }), -0.58, 2.37, 0.06, room); // a boxed set
  box(0.06, 0.06, 0.06, std(0xd8d2c6), -0.36, 2.245, 0.1, room);
});
shelf(1.1, 2.3, 0, 0.62, 0x1b1b1b, () => {
  box(0.28, 0.24, 0.05, std(0x4b5563, { roughness: 0.5 }), 1.12, 2.43, 0.05, room);
  box(0.07, 0.07, 0.07, std(0xb74c3d), 0.88, 2.35, 0.1, room);
});
shelf(0.55, 1.6, 0, 0.42, 0x1b1b1b, () => {
  const colors = [0x7a2618, 0x2f3d57, 0x6b4d1c, 0x1f3b2f, 0x5c1d1d];
  colors.forEach((c, i) => box(0.035, 0.22, 0.13, std(c), 0.39 + i * 0.04, 1.725, 0.085, room));
});
shelf(2.2, 1.95, 0, 0.55, 0xf4f1ec, () => {
  box(0.12, 0.1, 0.12, std(0x8fb0d6), 2.05, 2.01, 0.09, room);
});
shelf(2.15, 1.45, 0, 0.5, 0xf4f1ec, () => {
  for (const [x, c] of [[1.98, 0xe0559b], [2.3, 0xf0b54d]]) {
    box(0.1, 0.02, 0.1, std(0x111111), x, 1.475, 0.09, room);
    const dome = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.2, 20),
      new THREE.MeshPhysicalMaterial({ color: 0xffffff, transmission: 0.9, roughness: 0.05, transparent: true, opacity: 0.35 }));
    dome.position.set(x, 1.585, 0.09); room.add(dome);
    const bloom = new THREE.Mesh(new THREE.IcosahedronGeometry(0.03, 0), std(c, { emissive: c, emissiveIntensity: 0.6 }));
    bloom.position.set(x, 1.6, 0.09); room.add(bloom);
  }
});

// a trailing plant on the low shelf
function plant(x, y, z, trail, seed) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  room.add(g);
  box(0.13, 0.1, 0.13, std(0xece6dc), 0, 0.05, 0, g, 0.02);
  const leafGeo = new THREE.SphereGeometry(0.035, 7, 5);
  leafGeo.scale(1, 0.35, 0.75);
  const leafMat = std(0x2f6b2a, { roughness: 0.55 });
  const r = rng(seed);
  for (let v = 0; v < 9; v++) {
    const a = r() * Math.PI * 2;
    const len = trail * (0.4 + r() * 0.6);
    const pts = [V(0, 0.1, 0), V(Math.cos(a) * 0.12, 0.16, Math.sin(a) * 0.12 + 0.05),
      V(Math.cos(a) * 0.2, 0.05, Math.sin(a) * 0.15 + 0.1), V(Math.cos(a) * 0.22, 0.05 - len, Math.sin(a) * 0.1 + 0.14)];
    const curve = new THREE.CatmullRomCurve3(pts);
    const vine = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.004, 4), std(0x3c6a2a));
    g.add(vine);
    for (let i = 0; i < 9; i++) {
      const p = curve.getPoint(i / 9 + 0.05);
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.copy(p).add(V((r() - 0.5) * 0.04, 0, (r() - 0.5) * 0.04));
      leaf.rotation.set(r() * 2, r() * 6, r() * 2);
      leaf.castShadow = true;
      g.add(leaf);
    }
  }
  return g;
}
plant(0.68, 1.613, 0.09, 0.5, 21);

// ceiling light
const ceilingLamp = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.04, 32),
  new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2dd, emissiveIntensity: 2 }));
ceilingLamp.position.set(0.6, 2.68, 2.1);
room.add(ceilingLamp);

// ----------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0xfff1e4, 0x7d6b5c, 1.15));
const key = new THREE.PointLight(0xffe6cc, 9, 0, 1.6);
key.position.set(0.6, 2.5, 2.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0008;
key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffeedd, 0.5);
fill.position.set(3, 3, 5);
scene.add(fill);

// ----------------------------------------------------------- the standing desk
const DESK = { x0: -1.28, x1: 0.16, d: 0.7, top: 1.13 };
const desk = new THREE.Group();
scene.add(desk);
const black = std(0x161616, { roughness: 0.55 });
const satin = std(0x1e1e1e, { roughness: 0.4, metalness: 0.3 });
box(DESK.x1 - DESK.x0, 0.028, DESK.d, black, (DESK.x0 + DESK.x1) / 2, DESK.top - 0.014, DESK.d / 2, desk, 0.008);
for (const lx of [DESK.x0 + 0.13, DESK.x1 - 0.13]) {
  box(0.075, DESK.top - 0.06, 0.06, satin, lx, (DESK.top - 0.06) / 2, 0.34, desk);
  box(0.065, 0.035, 0.66, satin, lx, 0.018, 0.34, desk);

function limb(r, len, material) {

const UP = V(0, 1, 0);
function placeLimb(m, a, b) {
  m.position.copy(a).add(b).multiplyScalar(0.5);
  const d = b.clone().sub(a);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
}
// two-bone IK: elbow or knee between root and target, bent towards `pole`
function ik(root, target, l1, l2, pole) {
  const toT = target.clone().sub(root);
  const d = clamp(toT.length(), Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
  const dir = toT.normalize();
  const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const joint = root.clone().add(dir.clone().multiplyScalar(a)).add(p.multiplyScalar(h));
  const end = root.clone().add(dir.multiplyScalar(d));
  return [joint, end];
}

  g.fillStyle = '#ffd100'; g.font = `600 14px ${FONT}`; g.fillText('Walka', fx + 10, fy + 16);
  const rec = s.state === 'rec';
  g.fillStyle = rec ? '#4dd966' : '#9e9e9e'; g.beginPath(); g.arc(fx + 62, fy + 16, 3.5, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.font = `400 12px ${FONT}`; g.fillText(rec ? 'Recording' : (s.state === 'saved' ? 'Saved' : 'Ready'), fx + 72, fy + 16);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(fx + 8, fy + 28, fw - 16, 1);
  g.fillStyle = '#fff'; g.font = `600 28px ${FONT}`; g.textBaseline = 'alphabetic'; g.fillText(s.mph.toFixed(1), fx + 10, fy + 60);
  const tw = g.measureText(s.mph.toFixed(1)).width;
  g.fillStyle = '#ffd100'; g.font = `400 12px ${FONT}`; g.fillText('mph', fx + 14 + tw, fy + 60);
  g.fillStyle = '#9e9e9e'; g.textAlign = 'right'; g.fillText('Today', fx + fw - 10, fy + 56); g.textAlign = 'left';
  g.textBaseline = 'middle';
  const num = (x, y, a, b) => { g.fillStyle = '#fff'; g.font = `600 13px ${FONT}`; g.fillText(a, x, y); const aw = g.measureText(a).width; g.fillStyle = '#9e9e9e'; g.font = `400 11px ${FONT}`; g.fillText(b, x + aw + 3, y); };
  num(fx + 10, fy + 78, Math.floor(s.steps).toLocaleString('en-US'), 'steps');
  num(fx + 104, fy + 78, String(Math.floor(s.kcal)), 'kcal');
  num(fx + 10, fy + 97, s.mi.toFixed(2), 'mi');
  g.fillStyle = '#fff'; g.font = `600 13px ${FONT}`; g.fillText(fmtTime(s.secs), fx + 104, fy + 97);
  hudTex.needsUpdate = true;
}

// ------------------------------------------------------------- simulation
// Everything that accumulates (the gait, the belt, the walk numbers, the
// character on its trail) is stepped forward in small fixed steps, so a
// given second always looks the same - in the browser and in the video.
const sim = {};
function resetSim() {
  Object.assign(sim, { t: 0, beltDist: 0, gait: 0, secs: 0, mi: 0, steps: 0, kcal: 0, max: 0, heroS: 0.02, heroWalk: 0 });
}
resetSim();
const DT = 1 / 240;
function advance(to) {
  if (to < sim.t) resetSim();
  while (sim.t < to - 1e-9) {
    const dt = Math.min(DT, to - sim.t);
    const t = sim.t;
    const mph = beltMph(t), mps = mph * 0.44704;
    sim.beltDist += mps * dt;
    if (mps > 0.01) {
      const cadence = 1.55 * Math.sqrt(mps / 0.67);     // steps per second
      sim.gait += dt * cadence / 2;                     // one gait cycle = two steps
      const rate = timeRate(t);
      sim.secs += dt * rate;
      sim.mi += mph / 3600 * dt * rate;
      sim.steps += cadence * dt * rate;
      sim.kcal += (1.4 + 1.3 * mph) / 60 * dt * rate;
      sim.max = Math.max(sim.max, mph);
    }
    // the character runs while the player is walking and playing
    const heroSpeed = 7 * smooth(6.5, 8.5, t) * (1 - smooth(23.5, 25.5, t)); // yards per second, roughly
    sim.heroS = (sim.heroS + heroSpeed * dt / trail.getLength()) % 1;
    sim.heroWalk += heroSpeed * dt;
    sim.t += dt;
  }
}

// ---------------------------------------------------------------- camera
const SHOTS = [
  // [time, position, target, fov]
  [0.0, V(1.45, 2.05, 3.55), V(-0.5, 1.05, 0.35), 42],
  [3.4, V(1.2, 1.9, 3.1), V(-0.5, 0.95, 0.4), 42],
  [5.0, V(0.85, 1.15, 2.75), V(-0.45, 0.5, 0.75), 40],
  [8.4, V(0.8, 1.0, 2.55), V(-0.45, 0.4, 0.8), 40],
  [10.2, V(-0.7, 1.58, 0.74), V(-0.97, 1.52, 0.2), 50],
  [14.4, V(-0.72, 1.6, 0.7), V(-0.97, 1.53, 0.2), 48],
  [16.2, V(0.42, 1.95, 1.4), V(-0.37, 1.4, 0.15), 36],
  [20.4, V(0.36, 1.9, 1.3), V(-0.38, 1.4, 0.15), 34],
  [22.6, V(0.75, 1.45, 3.0), V(-0.45, 1.0, 0.75), 44],
  [25.6, V(0.95, 1.6, 3.1), V(-0.45, 0.9, 0.55), 42],
  [28.0, V(1.45, 2.05, 3.6), V(-0.5, 1.05, 0.35), 42],
  [DURATION, V(1.55, 2.1, 3.75), V(-0.5, 1.05, 0.35), 42],
];
function shotAt(t) {
  let i = 0;
  while (i < SHOTS.length - 2 && t > SHOTS[i + 1][0]) i++;
  const [t0, p0, q0, f0] = SHOTS[i], [t1, p1, q1, f1] = SHOTS[i + 1];
  const k = smooth(t0, t1, t);
  return { pos: p0.clone().lerp(p1, k), tgt: q0.clone().lerp(q1, k), fov: lerp(f0, f1, k) };
}

// ---------------------------------------------------------------- one frame
const tmp = V(0, 0, 0);
function reachAmount(t) {
  let a = 0;
  for (const [s, p, e] of REMOTE_PRESSES) a = Math.max(a, smooth(s, p - 0.35, t) * (1 - smooth(p + 0.15, e, t)));
  return a;
}
function pressAmount(t) {
  let a = 0;
  for (const [, p] of REMOTE_PRESSES) a = Math.max(a, 1 - clamp(Math.abs(t - p) / 0.18));
  return a;
}

function poseWalker(t) {
  const mph = beltMph(t), mps = mph * 0.44704;
  const cadence = mps > 0.01 ? 1.55 * Math.sqrt(mps / 0.67) : 1;
  const T = 2 / cadence;
  const stride = mps * 0.6 * T;                  // how far a planted foot rides the belt
  const amp = clamp(mph / 0.6);
  const lift = 0.075 * amp;
  const belt = PAD.h;
  const phase = sim.gait;
  const bob = 0.012 * amp * Math.cos(phase * Math.PI * 4);
  const sway = 0.012 * amp * Math.sin(phase * Math.PI * 2);
  const hips = V(WALKER.x + sway, belt + 0.93 + bob, WALKER.z);
  const lean = 0.08;
  // legs
  for (let i = 0; i < 2; i++) {
    const side = i ? 1 : -1;
    const ph = ((phase + i * 0.5) % 1 + 1) % 1;
    let fz, fy = belt + 0.06, pitch = 0;
    if (ph < 0.6) { fz = WALKER.z + 0.03 - stride / 2 + stride * (ph / 0.6); }
    else { const u = (ph - 0.6) / 0.4; fz = WALKER.z + 0.03 + stride / 2 - stride * smooth(0, 1, u); fy += lift * Math.sin(Math.PI * u); pitch = -0.35 * Math.sin(Math.PI * u) * amp; }
    const hip = hips.clone().add(V(side * 0.095, -0.05, 0));
    const ankle = V(WALKER.x + side * 0.105, fy, fz);
    const [knee, end] = ik(hip, ankle, THIGH, SHIN, V(0, 0.2, -1));
    placeLimb(body.thigh[i], hip, knee);
    placeLimb(body.shin[i], knee, end);
    const foot = body.foot[i];
    foot.position.set(end.x, end.y - 0.02, end.z - 0.06);
    foot.rotation.set(pitch, 0, 0);
  }
  body.pelvis.position.copy(hips);
  // torso, leaning a little towards the desk
  const chest = hips.clone().add(V(0, 0.44, -0.44 * Math.sin(lean)));
  const tw = 0.05 * amp * Math.sin(phase * Math.PI * 2);
  body.torso.position.copy(hips).add(chest).multiplyScalar(0.5).add(V(0, 0.03, 0));
  body.torso.rotation.set(-lean, tw, 0);
  const neckBase = chest.clone().add(V(0, 0.12, -0.01));
  const headPos = neckBase.clone().add(V(0, 0.15, -0.02));
  placeLimb(body.neck, neckBase, headPos.clone().add(V(0, -0.06, 0)));
  body.head.position.copy(headPos);
  body.hair.position.copy(headPos).add(V(0, 0.01, 0.008));
  body.hair.rotation.set(-0.35, 0, 0);
  body.bun.position.copy(headPos).add(V(0, 0.08, 0.08));
  // arms: right hand on the mouse, left on the keyboard - or on the remote
  const reach = reachAmount(t), press = pressAmount(t);
  const kb = V(-0.6, DESK.top + 0.05, 0.5 + 0.004 * Math.sin(t * 9));
  const rem = remote.position.clone().add(V(0.0, 0.035 - 0.012 * press, -0.02));
  const mouseT = mouse.position.clone().add(V(0.004 * Math.sin(t * 1.7), 0.035, 0.02 + 0.01 * Math.sin(t * 2.3)));
  mouse.position.x = -0.18 + 0.012 * Math.sin(t * 1.7);
  mouse.position.z = 0.48 + 0.01 * Math.sin(t * 2.3);
  const targets = [kb.clone().lerp(rem, reach).add(V(0, 0.07 * Math.sin(Math.PI * reach), 0)), mouseT];
  for (let i = 0; i < 2; i++) {
    const side = i ? 1 : -1;
    const sh = chest.clone().add(V(side * 0.19, 0.06, 0)).add(V(0, 0, tw * side * -0.2));
    const [elbow, wrist] = ik(sh, targets[i], UPPER, FORE, V(side * 0.6, -1, 0.5));
    placeLimb(body.upper[i], sh, elbow);
    placeLimb(body.fore[i], elbow, wrist);
    body.hand[i].position.copy(wrist).add(tmp.copy(wrist).sub(elbow).normalize().multiplyScalar(0.03));
    body.hand[i].quaternion.copy(body.fore[i].quaternion);
  }
  remoteBtn.material.emissiveIntensity = 0.4 + 2.5 * press;
  remoteBtn.position.y = 0.01 - 0.003 * press;
}

function poseGame(t) {
  const p = trail.getPointAt(sim.heroS);
  const tan = trail.getTangentAt(sim.heroS);
  hero.position.set(p.x, groundH(p.x, p.z), p.z);
  const ang = Math.atan2(tan.x, tan.z);
  hero.rotation.y = ang;
  const run = smooth(6.5, 8.5, t) * (1 - smooth(23.5, 25.5, t));
  const sw = Math.sin(sim.heroWalk * 1.4) * 0.7 * run;
  heroParts.legs[0].rotation.x = sw; heroParts.legs[1].rotation.x = -sw;
  heroParts.armL.rotation.x = -sw * 0.8; heroParts.armR.rotation.x = sw * 0.5 - 0.2;
  hero.position.y += Math.abs(Math.cos(sim.heroWalk * 1.4)) * 0.08 * run;
  heroParts.cape.rotation.x = 0.15 + 0.25 * run + 0.05 * Math.sin(t * 6);
  // third-person camera behind and above
  const back = tan.clone().multiplyScalar(-7.5);
  const cp = V(p.x + back.x, 0, p.z + back.z);
  cp.y = Math.max(groundH(cp.x, cp.z), hero.position.y) + 3.4;
  gameCam.position.copy(cp);
  gameCam.lookAt(hero.position.x + tan.x * 4, hero.position.y + 1.6, hero.position.z + tan.z * 4);
  return { heroPos: p, heroAngle: Math.PI - ang };
}

const captionEl = document.getElementById('caption');
const timelapseEl = document.getElementById('timelapse');
const endEl = document.getElementById('endcard');
let lastCaption = -1;
function overlays(t) {
  let idx = -1, op = 0;
  CAPTIONS.forEach(([s, e], i) => { const o = smooth(s, s + 0.4, t) * (1 - smooth(e - 0.4, e, t)); if (o > op) { op = o; idx = i; } });
  if (idx !== lastCaption && idx >= 0) {
    const [, , text, sub] = CAPTIONS[idx];
    captionEl.innerHTML = text + (sub ? `<span class="sub">${sub}</span>` : '');
    lastCaption = idx;
  }
  captionEl.style.opacity = op.toFixed(3);
  timelapseEl.style.opacity = clamp((timeRate(t) - 1) / 20).toFixed(3);
  endEl.style.opacity = smooth(28.3, 29.0, t).toFixed(3);
}

let freeCam = false, controls = null;
function renderAt(t) {
  advance(t);
  const mph = beltMph(t);
  // the belt moves towards the back of the pad, under the walker's feet
  beltTex.offset.y = (sim.beltDist / BELT_L) * beltTex.repeat.y;
  drawPadDisplay(mph, t > 3.0);
  poseWalker(t);
  const g = poseGame(t);
  const state = t < 5.2 ? 'ready' : (t < 25.6 ? 'rec' : 'saved');
  const shown = { t, state, mph, moving: mph > 0.05, secs: sim.secs, mi: sim.mi, steps: sim.steps, kcal: sim.kcal, max: sim.max, avg: sim.secs > 1 ? sim.mi / (sim.secs / 3600) : 0, ...g };
  drawDashboard(shown);
  drawHud(shown);
  // RGB fans drift through their colours
  for (const f of fanMats) f.mat.emissive.setHSL((f.hue + t * 0.04) % 1, 1, f.soft ? 0.35 : 0.55);
  pcBGlow.color.setHSL((0.55 + t * 0.04) % 1, 0.8, 0.6);
  if (!freeCam) {
    const s = shotAt(t);
    camera.position.copy(s.pos); camera.lookAt(s.tgt);
    if (camera.fov !== s.fov) { camera.fov = s.fov; camera.updateProjectionMatrix(); }
  } else controls.update();
  renderer.setRenderTarget(gameRT);
  renderer.render(game, gameCam);
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  overlays(freeCam ? -1 : t);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the shots framed on a narrow screen
  camera.zoom = Math.min(1, (w / h) / (16 / 9) * 1.15);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ----------------------------------------------------------------- playing
if (RECORD) {
  window.__demo = { duration: DURATION, render: t => { renderAt(t); return true; } };
  renderAt(0);
  window.__demoReady = true;
} else {
  let playing = true, clock = Number(params.get('t')) || 0, last = performance.now();
  const playBtn = document.getElementById('play');
  const freeBtn = document.getElementById('free');
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(!playing)); };
  document.getElementById('restart').onclick = () => { clock = 0; };
  freeBtn.onclick = () => {
    freeCam = !freeCam;
    freeBtn.setAttribute('aria-pressed', String(freeCam));
    if (freeCam) {
      controls = controls || new OrbitControls(camera, canvas);
      controls.enabled = true;
      controls.target.copy(shotAt(clock).tgt);
      controls.minDistance = 0.4; controls.maxDistance = 5;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.enableDamping = true;
    } else if (controls) controls.enabled = false;
  };
  const tick = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) { clock += dt; if (clock > DURATION) clock = 0; }
    renderAt(clock);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
