<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walka demo</title>
<!--
  Walka in 3D: a walking pad under a standing desk, the Walka dashboard on
  the upright monitor and a game on the other. Everything is drawn here, in
  three.js - no models or pictures are loaded: the room, its textures, the
  person and the game are all made by the code below.

  What makes it look like a room and not like a drawing: the light that
  bounces (the room is captured once as its own environment map), shadows
  in the corners and under things (ambient occlusion), screens and fans
  that light what is near them, a little bloom, and a camera with a lens.

  Open this file in a browser (it fetches three.js from a CDN).
    ?fast     - without the post-processing, for a slow machine
    ?t=12     - start at second 12
    ?record   - no clock of its own: tools/record_demo.cjs steps it frame by
                frame, and averages ?samples=6 renders into each frame
-->
<style>
  :root {
    --ink: #f1f3f6;
    --ink-2: #b9c0cb;
    --panel: rgba(11, 13, 16, 0.78);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #6da7ec;
    --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0d10;
    color: var(--ink);
    font-family: var(--font);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .brand {
    position: fixed; top: 20px; left: 20px;
    padding: 6px 14px 6px 6px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 20px; letter-spacing: 0.2px;
  }
  .brand svg { width: 32px; height: 32px; border-radius: 8px; }
  .brand small { font-weight: 400; color: var(--ink-2); font-size: 14px; margin-left: 4px; }

  .timelapse {
    position: fixed; top: 24px; right: 24px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2); opacity: 0;
  }
  .timelapse b { color: var(--ink); font-weight: 600; }

  .caption {
    position: fixed; left: 50%; bottom: 7%;
    transform: translateX(-50%);
    max-width: min(880px, calc(100% - 48px));
    box-sizing: border-box;
    padding: 14px 22px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(6px);
    font-size: clamp(15px, 2.1vw, 22px);
    line-height: 1.35;
    text-align: center;
    opacity: 0;
  }
  .caption b { color: #fff; }
  .caption .sub { display: block; font-size: 0.72em; color: var(--ink-2); margin-top: 4px; }

  .endcard {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, rgba(11,13,16,.82), rgba(11,13,16,.96));
    opacity: 0; pointer-events: none; text-align: center; padding: 24px;
  }
  .endcard svg { width: 84px; height: 84px; border-radius: 20px; }
  .endcard h1 { margin: 0; font-size: clamp(30px, 5vw, 54px); font-weight: 650; }
  .endcard p { margin: 0; color: var(--ink-2); font-size: clamp(14px, 2vw, 20px); max-width: 720px; }
  .endcard p.small { font-size: clamp(12px, 1.5vw, 15px); opacity: .85; }

  .controls {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; gap: 8px;
  }
  .controls button {
    font: 500 13px var(--font);
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button[aria-pressed="true"] { background: #13233a; border-color: var(--accent); }
  body.record .controls { display: none; }

  @media (max-width: 600px) {
    .brand { top: 14px; left: 16px; font-size: 17px; }
    .brand small { display: none; }
    .timelapse { top: 16px; right: 16px; }
    .caption { bottom: 72px; padding: 10px 14px; }
    .controls { left: 16px; right: 16px; justify-content: center; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="brand" aria-hidden="true">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#256abf"/><path d="M8.2 15.6 12.4 8l3.6 5.6L19.6 9l4.2 6.6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="20" width="20" height="4.6" rx="2.3" fill="#fff" fill-opacity=".55"/></svg>
  Walka <small>walk while you play</small>
</div>
<div class="timelapse" id="timelapse">Walk numbers sped up <b>×60</b></div>
<div class="caption" id="caption" role="status" aria-live="polite"></div>

<div class="endcard" id="endcard">
  <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#256abf"/><path d="M8.2 15.6 12.4 8l3.6 5.6L19.6 9l4.2 6.6" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="20" width="20" height="4.6" rx="2.3" fill="#fff" fill-opacity=".55"/></svg>
  <h1>Walka</h1>
  <p>Free for Windows and Mac, with an addon for World of Warcraft.<br>Steps, miles and calories - filed under the character you play.</p>
  <p class="small">Walka only listens to your treadmill. Walking while you play is at your own risk.</p>
</div>

<div class="controls">
  <button type="button" id="play" aria-pressed="false">Pause</button>
  <button type="button" id="free" aria-pressed="false" title="Drag to look around, scroll to zoom">Look around</button>
  <button type="button" id="restart">Restart</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { generateMagicSquareNoise } from 'three/addons/shaders/GTAOShader.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { TexturePass } from 'three/addons/postprocessing/TexturePass.js';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const params = new URLSearchParams(location.search);
const RECORD = params.has('record');
const FAST = params.has('fast');                 // no post-processing: for a slow machine
// In a recording each frame is the average of several renders, each with
// the lamp, the lens and the moment nudged a little: soft shadows, a
// shallow depth of field, motion blur and smooth edges, as a camera has.
const SAMPLES = RECORD ? Math.max(1, Number(params.get('samples')) || 6) : 1;
if (RECORD) document.body.classList.add('record');

const DURATION = 31;           // seconds in one run of the demo
const FONT = '"Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif';

// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);

// a seeded random, so every frame of every run is the same
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// smooth noise that tiles every `period` cells
function tileNoise(period, seed) {
  const r = rng(seed); const g = new Float32Array(period * period);
  for (let i = 0; i < g.length; i++) g[i] = r();
  const at = (x, y) => g[((y % period + period) % period) * period + ((x % period + period) % period)];
  return (x, y) => {
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(at(x0, y0), at(x0 + 1, y0), sx), lerp(at(x0, y0 + 1), at(x0 + 1, y0 + 1), sx), sy);
  };
}

function canvasTexture(w, h, draw, opts = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: !!opts.read });
  draw(g, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = opts.data ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  if (opts.repeat) { tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(...opts.repeat); }
  tex.userData = { canvas: c, ctx: g };
  return tex;
}
// a height field (0..1, tiling) -> a colour canvas and a normal map
function heightTextures(size, heightFn, { strength = 1, repeat = [1, 1], color = null } = {}) {
  const H = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) H[y * size + x] = heightFn(x, y);
  const at = (x, y) => H[((y + size) % size) * size + ((x + size) % size)];
  const normal = canvasTexture(size, size, (g) => {
    const img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = (at(x + 1, y) - at(x - 1, y)) * strength, dy = (at(x, y + 1) - at(x, y - 1)) * strength;
      const l = Math.hypot(dx, dy, 1), i = (y * size + x) * 4;
      img.data[i] = (-dx / l * 0.5 + 0.5) * 255; img.data[i + 1] = (dy / l * 0.5 + 0.5) * 255; img.data[i + 2] = (1 / l * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, { data: true, repeat });
  let map = null;
  if (color) map = canvasTexture(size, size, (g) => {
    const img = g.createImageData(size, size);
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const c = color(at(x, y), x, y), i = (y * size + x) * 4;
      img.data[i] = c[0]; img.data[i + 1] = c[1]; img.data[i + 2] = c[2]; img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }, { repeat });
  return { normal, map };
}

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0, ...o });
const phys = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.6, metalness: 0, ...o });

function put(m, x, y, z, parent, shadow = true) {
  m.position.set(x, y, z);
  if (shadow) m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  if (parent) parent.add(m);
  return m;
}
// a box with rounded edges - nothing in a room has a perfectly sharp corner
function rbox(w, h, d, mat, x = 0, y = 0, z = 0, parent = null, r = 0.006, seg = 2) {
  r = Math.min(r, w / 2 - 1e-4, h / 2 - 1e-4, d / 2 - 1e-4);
  return put(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, seg, r), mat), x, y, z, parent);
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = null, seg = 24) {
  return put(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat), x, y, z, parent);
}
function ball(r, mat, x = 0, y = 0, z = 0, parent = null, scale = null, seg = 24) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.7)), mat);
  if (scale) m.scale.set(...scale);
  return put(m, x, y, z, parent);
}
function tube(points, r, mat, parent = null, seg = 32, rs = 8) {
  const curve = points instanceof THREE.Curve ? points : new THREE.CatmullRomCurve3(points);
  return put(new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, rs), mat), 0, 0, 0, parent);
}
// a surface of revolution from a profile of [radius, height] pairs
function lathe(profile, mat, x = 0, y = 0, z = 0, parent = null, seg = 28) {
  return put(new THREE.Mesh(new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg), mat), x, y, z, parent);
}
// a tube of elliptical cross-sections: [y, rx, rz, zOffset] - bodies, shoes
function loft(sections, seg = 28) {
  const pos = [], idx = [], uv = [];
  sections.forEach(([y, rx, rz, zo = 0]) => {
    for (let j = 0; j <= seg; j++) { const a = j / seg * Math.PI * 2 - Math.PI / 2; pos.push(Math.cos(a) * rx, y, Math.sin(a) * rz + zo); uv.push(j / seg * 3, y * 6); }
  });
  for (let i = 0; i < sections.length - 1; i++) for (let j = 0; j < seg; j++) { const a = i * (seg + 1) + j, b = a + seg + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const n = geo.attributes.normal;   // close the seam
  for (let i = 0; i < sections.length; i++) {
    const a = i * (seg + 1), b = a + seg;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b), l = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l);
  }
  return geo;
}

// ------------------------------------------------------------ the timeline
// Belt speed in mph, as the treadmill reports it. Walka never sets it: the
// walker does, with the pad's own remote (see the left hand, below).
function beltMph(t) {
  if (t < 5.2) return 0;
  if (t < 8.2) return 1.5 * smooth(5.2, 8.2, t);
  if (t < 12.6) return 1.5;
  if (t < 13.8) return lerp(1.5, 2.0, smooth(12.6, 13.8, t));
  if (t < 22.6) return 2.0;
  if (t < 25.4) return 2.0 * (1 - smooth(22.6, 25.4, t));
  return 0;
}
// When the left hand goes to the remote: [start, press, back]
const REMOTE_PRESSES = [[3.9, 4.9, 5.9], [11.6, 12.5, 13.4], [21.5, 22.4, 23.3]];
// Walk numbers run 60 times faster in the middle of the demo (said on screen).
const timeRate = t => 1 + 59 * (smooth(8.6, 9.4, t) - smooth(22.0, 22.6, t));

const CAPTIONS = [
  [0.4, 4.2, 'A walking pad under a standing desk - <b>and a game on the screen</b>.'],
  [4.4, 8.6, '<b>Start the belt with the treadmill\'s own remote.</b>', 'Walka cannot start, stop or change the belt - it only listens.'],
  [8.9, 14.6, 'Walka hears the pad over Bluetooth and <b>records the walk</b>:', 'time, distance, steps and calories, live on the dashboard.'],
  [14.9, 20.6, '<b>Play as usual.</b> The walk counts for the character you are playing.', 'A small floating window sits over the game, if you want it.'],
  [20.9, 25.8, 'Done for now? <b>Stop the belt at the treadmill.</b>', 'Keep its remote within reach - stopping is yours.'],
  [26.0, 28.4, 'Walka <b>saves the walk</b>, under your character.'],
];

// --------------------------------------------------------------- renderer
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: FAST, preserveDrawingBuffer: RECORD, powerPreference: 'high-performance' });
renderer.setPixelRatio(RECORD ? 1 : Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;       // asked for once per frame, below
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.outputColorSpace = THREE.SRGBColorSpace;
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0a09);
const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.05, 60);

// ------------------------------------------------- materials, all drawn here
const T = {};
{
  const n1 = tileNoise(256, 1), n2 = tileNoise(32, 2), n3 = tileNoise(8, 3);
  // carpet: short tufts, a little uneven
  T.carpet = heightTextures(256, (x, y) => 0.6 * n1(x, y) + 0.3 * n2(x / 8, y / 8) + 0.1 * n3(x / 32, y / 32), {
    strength: 2.2, repeat: [9, 9],
    color: (h) => { const k = 0.82 + h * 0.3; return [198 * k, 180 * k, 160 * k]; },
  });
  // painted wall: roller stipple
  const w1 = tileNoise(128, 4), w2 = tileNoise(16, 5);
  T.wall = heightTextures(256, (x, y) => 0.5 * w1(x / 2, y / 2) + 0.5 * w2(x / 16, y / 16), { strength: 0.55, repeat: [5, 3] });
  // woven cloth
  const f1 = tileNoise(128, 6);
  T.cloth = heightTextures(128, (x, y) => 0.35 * Math.sin(x * Math.PI / 2) * Math.sin(y * Math.PI / 2) + 0.35 * Math.sin((x + y) * Math.PI / 4) + 0.3 * f1(x, y), { strength: 0.9, repeat: [10, 10] });
  T.knit = heightTextures(128, (x, y) => 0.5 * Math.abs(Math.sin(x * Math.PI / 4 + Math.sin(y * Math.PI / 4) * 0.8)) + 0.5 * f1(x, y), { strength: 1.2, repeat: [6, 6] });
  // folds: hanging ones for a body, ringed ones for sleeves and trouser legs
  const d1 = tileNoise(32, 10), d2 = tileNoise(16, 11);
  const ridge = v => 1 - Math.abs(2 * v - 1);
  T.folds = heightTextures(256, (x, y) => 0.6 * ridge(d1((x + y * 0.12) / 20, y / 85)) + 0.25 * ridge(d2(x / 40, y / 30)) + 0.15 * (0.5 + 0.5 * Math.sin(x * Math.PI / 2) * Math.sin(y * Math.PI / 2)), { strength: 3.2, repeat: [1, 1] });
  T.rings = heightTextures(256, (x, y) => 0.6 * ridge(d1(x / 60, (y + x * 0.2) / 11)) + 0.25 * ridge(d2(x / 30, y / 22)) + 0.15 * (0.5 + 0.5 * Math.sin(x * Math.PI / 2) * Math.sin(y * Math.PI / 2)), { strength: 3.0, repeat: [1, 1] });
  // moulded plastic: a fine grain
  const p1 = tileNoise(128, 7);
  T.grain = heightTextures(128, (x, y) => p1(x, y), { strength: 0.35, repeat: [8, 8] });
  // the belt: a fine diamond tread
  T.belt = heightTextures(128, (x, y) => { const u = (x + y) % 8, v = (x - y + 256) % 8; return Math.min(Math.abs(u - 4), Math.abs(v - 4)) / 4 * 0.8 + 0.2 * p1(x, y); }, { strength: 1.3, repeat: [14, 44] });
  // leather: pebbled
  const l1 = tileNoise(64, 8);
  T.leather = heightTextures(128, (x, y) => { const a = l1(x / 2, y / 2), b = l1(x / 2 + 31.5, y / 2 + 17.5); return Math.abs(a - b) ** 0.5; }, { strength: 0.8, repeat: [7, 7] });
  // hair: strands
  const h1 = tileNoise(128, 9);
  T.hair = heightTextures(128, (x, y) => 0.7 * h1(x, y / 14) + 0.3 * h1(x * 0.5, y / 3), { strength: 2.4, repeat: [3, 1] });
}
const M = {
  wall: std(0xe6d8cf, { roughness: 0.93, normalMap: T.wall.normal, normalScale: new THREE.Vector2(0.5, 0.5) }),
  trim: std(0xf3efe8, { roughness: 0.45 }),
  blackPlastic: std(0x121213, { roughness: 0.48, normalMap: T.grain.normal, normalScale: new THREE.Vector2(0.25, 0.25) }),
  blackGloss: phys(0x08080a, { roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08 }),
  blackMetal: std(0x17171a, { roughness: 0.42, metalness: 0.75 }),
  rubber: std(0x0d0d0e, { roughness: 0.9 }),
  whitePlastic: std(0xeeeeec, { roughness: 0.38 }),
  steel: std(0xc8cbd0, { roughness: 0.28, metalness: 1 }),
  gold: std(0xd0a35a, { roughness: 0.3, metalness: 1 }),
  glass: phys(0xffffff, { roughness: 0.03, transparent: true, opacity: 0.16, envMapIntensity: 2.2, depthWrite: false, side: THREE.DoubleSide }),
  smoked: phys(0x101216, { roughness: 0.04, transparent: true, opacity: 0.42, envMapIntensity: 2.2, depthWrite: false }),
};
const cloth = (color, o = {}) => phys(color, { roughness: 0.95, normalMap: T.cloth.normal, normalScale: new THREE.Vector2(0.6, 0.6), sheen: 0.3, sheenRoughness: 0.8, sheenColor: new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.15), ...o });

// ------------------------------------------------------------------- room
// Back wall is the plane z = 0, left wall is x = -1.6, floor is y = 0.
const ROOM = { left: -1.6, right: 3.6, depth: 5, h: 2.6 };
const room = new THREE.Group();
scene.add(room);
{
  const rw = ROOM.right - ROOM.left, cx = (ROOM.left + ROOM.right) / 2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(rw, ROOM.depth),
    phys(0xffffff, { map: T.carpet.map, normalMap: T.carpet.normal, normalScale: new THREE.Vector2(1.4, 1.4), roughness: 1, sheen: 0.5, sheenRoughness: 0.7, sheenColor: 0x8a7a68 }));

  g.fillStyle = '#fff'; g.font = `400 12px ${FONT}`; g.fillText(rec ? 'Recording' : (s.state === 'saved' ? 'Saved' : 'Ready'), fx + 72, fy + 16);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(fx + 8, fy + 28, fw - 16, 1);

  const tw = g.measureText(s.mph.toFixed(1)).width;

  g.fillStyle = '#9e9e9e'; g.textAlign = 'right'; g.fillText('Today', fx + fw - 10, fy + 56); g.textAlign = 'left';
  g.textBaseline = 'middle';

  num(fx + 10, fy + 78, Math.floor(s.steps).toLocaleString('en-US'), 'steps');

// ------------------------------------------------------------- simulation
// Everything that accumulates (the gait, the belt, the walk numbers, the
// character on its trail) is stepped forward in small fixed steps, so a
// given second always looks the same - in the browser and in the video.
const sim = {};
function resetSim() {
  Object.assign(sim, { t: 0, beltDist: 0, gait: 0, secs: 0, mi: 0, steps: 0, kcal: 0, max: 0, heroS: 0.02, heroWalk: 0 });
}
resetSim();
const DT = 1 / 240;
function advance(to) {
  if (to < sim.t) resetSim();
  while (sim.t < to - 1e-9) {
    const dt = Math.min(DT, to - sim.t);
    const t = sim.t;
    const mph = beltMph(t), mps = mph * 0.44704;
    sim.beltDist += mps * dt;
    if (mps > 0.01) {
      const cadence = 1.55 * Math.sqrt(mps / 0.67);     // steps per second
      sim.gait += dt * cadence / 2;                     // one gait cycle = two steps
      const rate = timeRate(t);
      sim.secs += dt * rate;
      sim.mi += mph / 3600 * dt * rate;
      sim.steps += cadence * dt * rate;
      sim.kcal += (1.4 + 1.3 * mph) / 60 * dt * rate;
      sim.max = Math.max(sim.max, mph);
    }
    // the character runs while the player is walking and playing
    const heroSpeed = 7 * smooth(6.5, 8.5, t) * (1 - smooth(23.5, 25.5, t)); // yards per second, roughly
    sim.heroS = (sim.heroS + heroSpeed * dt / trail.getLength()) % 1;
    sim.heroWalk += heroSpeed * dt;
    sim.t += dt;
  }
}

// ------------------------------------------------- light that has bounced
// The room is rendered once into an environment map from its middle, so
// that every surface is also lit - and mirrored, where it is glossy - by
// the walls, the lamp and the screens around it. Twice: the second time
// the first bounce is in the picture too.
function bakeEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const centre = V(0.5, 1.25, 2.0);
  walker.visible = false;
  for (let pass = 0; pass < 2; pass++) {
    scene.position.copy(centre).negate(); scene.updateMatrixWorld(true);
    renderer.shadowMap.needsUpdate = true;
    const rt = pmrem.fromScene(scene, 0.015, 0.05, 20);
    scene.position.set(0, 0, 0); scene.updateMatrixWorld(true);
    scene.environment = rt.texture;
  }
  scene.environmentIntensity = 0.7;
  walker.visible = true;
  pmrem.dispose();
}

// ------------------------------------------------------------ the pipeline
// scene -> ambient occlusion -> (averaged over the samples of a frame) ->
// bloom -> tone mapping -> a little lens: vignette, fringing, grain
const HDR = { type: THREE.HalfFloatType };
const composerA = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { ...HDR, samples: SAMPLES > 1 ? 0 : 4 }));
composerA.renderToScreen = false;
composerA.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 0.32, distanceExponent: 1.4, thickness: 1.0, scale: 1.15, samples: RECORD ? 10 : 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, radiusExponent: 1.5, rings: 2, samples: RECORD ? 8 : 16 });
gtao.blendIntensity = 0.95;
gtao.pdRenderTarget.texture.magFilter = THREE.LinearFilter;
// its dither pattern is shifted for every sample of a frame, so that the
// grain of the occlusion averages away instead of sitting on the walls
function rolled(tex, dx, dy) {
  const { data, width: w, height: h } = tex.image, out = new data.constructor(data.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) for (let c = 0; c < 4; c++) out[(y * w + x) * 4 + c] = data[(((y + dy) % h) * w + (x + dx) % w) * 4 + c];
  const t = new THREE.DataTexture(out, w, h, tex.format, tex.type);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.minFilter = tex.minFilter; t.magFilter = tex.magFilter; t.needsUpdate = true;
  return t;
}
const AO_NOISE = Array.from({ length: SAMPLES }, (_, k) => {
  const sq = generateMagicSquareNoise(k % 2 ? 7 : 5);
  return [k ? rolled(sq, k * 2, k * 3) : sq, k ? rolled(gtao.pdNoiseTexture, k * 17, k * 29) : gtao.pdNoiseTexture];
});
composerA.addPass(gtao);

const accumRT = new THREE.WebGLRenderTarget(1, 1, { ...HDR, depthBuffer: false });
const accumQuad = new FullScreenQuad(new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, opacity: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float opacity; varying vec2 vUv; void main() { gl_FragColor = vec4(texture2D(tDiffuse, vUv).rgb, opacity); }',
  transparent: true, depthTest: false, depthWrite: false,
}));

const composerB = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, HDR));
composerB.addPass(new TexturePass(accumRT.texture));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.16, 0.5, 1.1);
composerB.addPass(bloom);
composerB.addPass(new OutputPass());
const lens = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, grain: { value: 0.022 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float time; uniform float grain; varying vec2 vUv;
    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    void main() {
      vec2 d = vUv - 0.5; float r2 = dot(d, d);
      vec2 off = d * r2 * 0.003;
      vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      c *= mix(1.0, 0.7, smoothstep(0.12, 0.62, r2));
      float n = hash(gl_FragCoord.xy + fract(time) * 617.0) - 0.5;
      c += n * grain * (1.0 - 0.6 * dot(c, vec3(0.3, 0.6, 0.1)));
      gl_FragColor = vec4(c, 1.0);
    }`,
});
composerB.addPass(lens);

// ---------------------------------------------------------------- camera
const SHOTS = [
  // [time, position, target (also what is in focus), field of view, lens opening in metres]
  [0.0, V(1.45, 2.05, 3.55), V(-0.5, 1.05, 0.35), 42, 0.005],
  [3.4, V(1.2, 1.9, 3.1), V(-0.5, 0.95, 0.4), 42, 0.005],
  [5.0, V(0.85, 1.15, 2.75), V(-0.45, 0.5, 0.75), 40, 0.006],
  [8.4, V(0.8, 1.0, 2.55), V(-0.45, 0.4, 0.8), 40, 0.006],
  [10.2, V(-0.7, 1.58, 0.74), V(-0.97, 1.52, 0.2), 50, 0.0025],
  [14.4, V(-0.72, 1.6, 0.7), V(-0.97, 1.53, 0.2), 48, 0.0025],
  [16.2, V(0.5, 1.95, 1.42), V(-0.37, 1.4, 0.15), 36, 0.004],
  [20.4, V(0.44, 1.9, 1.32), V(-0.38, 1.4, 0.15), 34, 0.004],
  [22.6, V(0.75, 1.45, 3.0), V(-0.45, 1.0, 0.75), 44, 0.006],
  [25.6, V(0.95, 1.6, 3.1), V(-0.45, 0.9, 0.55), 42, 0.006],
  [28.0, V(1.45, 2.05, 3.6), V(-0.5, 1.05, 0.35), 42, 0.005],
  [DURATION, V(1.55, 2.1, 3.75), V(-0.5, 1.05, 0.35), 42, 0.005],
];
function shotAt(t) {
  let i = 0;
  while (i < SHOTS.length - 2 && t > SHOTS[i + 1][0]) i++;
  const [t0, p0, q0, f0, a0] = SHOTS[i], [t1, p1, q1, f1, a1] = SHOTS[i + 1];
  const k = smooth(t0, t1, t);
  const pos = p0.clone().lerp(p1, k), tgt = q0.clone().lerp(q1, k);
  // a hand-held camera is never quite still
  pos.add(V(Math.sin(t * 0.83) * 0.004 + Math.sin(t * 2.1) * 0.0015, Math.sin(t * 1.17 + 1) * 0.003, Math.sin(t * 0.6 + 2) * 0.003));
  return { pos, tgt, fov: lerp(f0, f1, k), aperture: lerp(a0, a1, k) };
}

// ---------------------------------------------------------------- one frame
const tmp = V(0, 0, 0);
function reachAmount(t) {
  let a = 0;
  for (const [s, p, e] of REMOTE_PRESSES) a = Math.max(a, smooth(s, p - 0.35, t) * (1 - smooth(p + 0.15, e, t)));
  return a;
}
function pressAmount(t) {
  let a = 0;
  for (const [, p] of REMOTE_PRESSES) a = Math.max(a, 1 - clamp(Math.abs(t - p) / 0.18));
  return a;
}

function poseWalker(t) {
  const mph = beltMph(t), mps = mph * 0.44704;
  const cadence = mps > 0.01 ? 1.55 * Math.sqrt(mps / 0.67) : 1;
  const stride = mps * 0.6 * (2 / cadence);      // how far a planted foot rides the belt
  const amp = clamp(mph / 0.6);
  const phase = sim.gait;
  const bob = 0.012 * amp * Math.cos(phase * Math.PI * 4);
  const sway = 0.014 * amp * Math.sin(phase * Math.PI * 2);
  const hips = V(WALKER.x + sway, PAD.h + HIP_Y + bob - 0.014 * amp, WALKER.z);
  const reach = reachAmount(t), press = pressAmount(t);
  // legs: a planted foot rides the belt back, heel first and toe last; a
  // lifted one swings forward
  for (let i = 0; i < 2; i++) {
    const side = i ? 1 : -1;
    const ph = ((phase + i * 0.5) % 1 + 1) % 1;
    let fz, lift = 0, pitch;
    if (ph < 0.6) { const s = ph / 0.6; fz = WALKER.z + 0.04 - stride / 2 + stride * s; pitch = 0.22 * (1 - smooth(0, 0.2, s)) - 0.5 * smooth(0.68, 1, s); }
    else { const u = (ph - 0.6) / 0.4; fz = WALKER.z + 0.04 + stride / 2 - stride * smooth(0, 1, u); lift = 0.045 * Math.sin(Math.PI * u); pitch = lerp(-0.5, 0.22, smooth(0.1, 0.95, u)); }
    pitch *= amp;
    const ankle = V(WALKER.x + side * 0.1, PAD.h + ANKLE + lift * amp + 0.13 * Math.sin(Math.max(0, -pitch)) + 0.06 * Math.sin(Math.max(0, pitch)), fz);
    const hip = hips.clone().add(V(side * 0.09, -0.07, 0));
    const [knee, end] = ik(hip, ankle, THIGH, SHIN, V(side * 0.04, 0.15, -1));
    placeLimb(body.thigh[i], hip, knee);
    placeLimb(body.shin[i], knee, end);
    body.foot[i].position.copy(end);
    body.foot[i].rotation.set(pitch, side * -0.06, 0);
  }
  const tw = 0.06 * amp * Math.sin(phase * Math.PI * 2);
  body.pelvis.position.copy(hips);
  body.pelvis.rotation.set(0, -tw * 0.8, sway * 1.5);
  // the hoodie leans a little towards the desk, and turns against the hips
  body.torso.position.copy(hips);
  body.torso.rotation.set(-0.075 - 0.03 * reach, tw + 0.12 * reach, -sway * 1.2);
  body.torso.updateMatrixWorld(true);
  const neckBase = NECK.clone().applyMatrix4(body.torso.matrixWorld);
  const headPos = neckBase.clone().add(V(0, 0.132, -0.022));
  placeLimb(body.neck, neckBase.clone().add(V(0, -0.02, 0)), headPos.clone().add(V(0, -0.055, 0.004)));
  // the head looks where the story is: the game, the dashboard, the remote
  const toDash = smooth(9.0, 10.0, t) * (1 - smooth(14.2, 15.4, t));
  body.head.position.copy(headPos);
  body.head.rotation.set(-0.1 - 0.22 * reach + 0.012 * Math.sin(t * 1.3), 0.4 * toDash + 0.5 * reach * (1 - toDash) - 0.03 + 0.02 * Math.sin(t * 0.7), 0, 'YXZ');
  // arms: right hand on the mouse, left on the keys - or on the remote
  const kb = V(-0.56, DESK.top + 0.076 + 0.003 * Math.sin(t * 11), 0.594);
  const rem = remote.position.clone().add(V(0.012, 0.066 - 0.014 * press, 0.105));
  mouse.position.x = -0.18 + 0.012 * Math.sin(t * 1.7) + 0.005 * Math.sin(t * 4.1);
  mouse.position.z = 0.48 + 0.01 * Math.sin(t * 2.3);
  const wrists = [kb.clone().lerp(rem, reach).add(V(0, 0.06 * Math.sin(Math.PI * reach), 0)), mouse.position.clone().add(V(0.004, 0.058, 0.056))];
  for (let i = 0; i < 2; i++) {
    const side = i ? 1 : -1;
    const sh = SHOULDER[i].clone().applyMatrix4(body.torso.matrixWorld);
    const [elbow, wrist] = ik(sh, wrists[i], UPPER, FORE, V(side * 0.55, -1, 0.55));
    placeLimb(body.upper[i], sh, elbow);
    placeLimb(body.fore[i], elbow, wrist);
    body.hand[i].position.copy(wrist);
    body.hand[i].rotation.x = i === 0 ? -0.12 - 0.1 * reach : -0.18;
  }
  remoteBtn.material.emissiveIntensity = 0.5 + 4 * press;
  remoteBtn.position.y = 0.009 - 0.002 * press;
}

function poseGame(t) {
  const p = trail.getPointAt(sim.heroS);
  const tan = trail.getTangentAt(sim.heroS);
  hero.position.set(p.x, groundH(p.x, p.z), p.z);
  const ang = Math.atan2(tan.x, tan.z);
  hero.rotation.y = ang + Math.PI;
  const run = smooth(6.5, 8.5, t) * (1 - smooth(23.5, 25.5, t));
  const sw = Math.sin(sim.heroWalk * 1.4) * 0.7 * run;
  heroParts.legs[0].rotation.x = sw; heroParts.legs[1].rotation.x = -sw;
  heroParts.armL.rotation.x = -sw * 0.8; heroParts.armR.rotation.x = sw * 0.4 - 0.25;
  hero.position.y += Math.abs(Math.cos(sim.heroWalk * 1.4)) * 0.08 * run;
  heroParts.cape.rotation.x = 0.12 + 0.28 * run + 0.05 * Math.sin(t * 6);
  // third-person camera behind and above
  const back = tan.clone().multiplyScalar(-7.5);
  const cp = V(p.x + back.x, 0, p.z + back.z);
  cp.y = Math.max(groundH(cp.x, cp.z), hero.position.y) + 3.3;
  gameCam.position.copy(cp);
  gameCam.lookAt(hero.position.x + tan.x * 4, hero.position.y + 1.7, hero.position.z + tan.z * 4);
  sun.target.position.copy(hero.position);
  sun.position.copy(hero.position).add(V(40, 60, 25));
  return { heroPos: p, heroAngle: Math.PI - ang };
}

const captionEl = document.getElementById('caption');
const timelapseEl = document.getElementById('timelapse');
const endEl = document.getElementById('endcard');
let lastCaption = -1;
function overlays(t) {
  let idx = -1, op = 0;
  CAPTIONS.forEach(([s, e], i) => { const o = smooth(s, s + 0.4, t) * (1 - smooth(e - 0.4, e, t)); if (o > op) { op = o; idx = i; } });
  if (idx !== lastCaption && idx >= 0) {
    const [, , text, sub] = CAPTIONS[idx];
    captionEl.innerHTML = text + (sub ? `<span class="sub">${sub}</span>` : '');
    lastCaption = idx;
  }
  captionEl.style.opacity = op.toFixed(3);
  timelapseEl.style.opacity = clamp((timeRate(t) - 1) / 20).toFixed(3);
  endEl.style.opacity = smooth(28.3, 29.0, t).toFixed(3);
}

// what moves within a frame: the walker, the belt, the fans
const fanColor = new THREE.Color();
function animate(t) {
  poseWalker(t);
  // the belt moves towards the back of the pad, under the walker's feet
  beltTex.offset.y = sim.beltDist / BELT_L;
  T.belt.normal.offset.y = sim.beltDist / BELT_L * T.belt.normal.repeat.y;
  for (const f of fans) {
    f.spin.rotation.z = t * 23;
    fanColor.setHSL((f.hue + t * 0.035) % 1, 1, 0.5);
    f.ringMat.emissive.copy(fanColor); f.bladeMat.emissive.copy(fanColor);
  }
  pcBGlow.color.setHSL((0.55 + t * 0.035) % 1, 0.8, 0.6);
}

let screensDrawn = -1;
function drawScreens(t) {
  const mph = beltMph(t);
  drawPadDisplay(mph, t > 3.0);
  const g = poseGame(t);
  const state = t < 5.2 ? 'ready' : (t < 25.6 ? 'rec' : 'saved');
  const shown = { t, state, mph, moving: mph > 0.05, secs: sim.secs, mi: sim.mi, steps: sim.steps, kcal: sim.kcal, max: sim.max, avg: sim.secs > 1 ? sim.mi / (sim.secs / 3600) : 0, ...g };
  if (RECORD || Math.abs(t - screensDrawn) > 1 / 12) { drawDashboard(shown); drawHud(shown); screensDrawn = t; }
  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(gameRT);
  renderer.render(game, gameCam);
  renderer.autoClear = false; hudQuad.render(renderer); renderer.autoClear = true;
  renderer.setRenderTarget(null);
}

// The samples of one frame: each a little off in the pixel, on the lens,
// around the lamp and in time. The same offsets every frame, so that what
// stands still stays still.
const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
const JITTER = Array.from({ length: SAMPLES }, (_, k) => {
  const a = Math.PI * 2 * halton(k + 1, 3), r = Math.sqrt((k + 0.5) / SAMPLES);
  const b = Math.PI * 2 * halton(k + 1, 5), q = Math.sqrt(halton(k + 1, 7));
  return { px: halton(k + 1, 2) - 0.5, py: halton(k + 1, 3) - 0.5, lx: Math.cos(a) * r, ly: Math.sin(a) * r, sx: Math.cos(b) * q, sz: Math.sin(b) * q };
});
const SHUTTER = 1 / 60, LAMP_R = 0.17;
let BW = 1, BH = 1;
const camRight = V(0, 0, 0), camUp = V(0, 0, 0);

// for looking at one thing while working on it: ?cam=x,y,z,tx,ty,tz,fov and ?nocap
const DEBUG_CAM = params.has('cam') ? (c => ({ pos: V(c[0], c[1], c[2]), tgt: V(c[3], c[4], c[5]), fov: c[6] || 40, aperture: 0.003 }))(params.get('cam').split(',').map(Number)) : null;
if (params.has('nocap')) for (const id of ['caption', 'timelapse', 'endcard']) document.getElementById(id).style.display = 'none';
let freeCam = false, controls = null;
function renderAt(t) {
  advance(t);
  drawScreens(t);
  const shot = freeCam ? null : (DEBUG_CAM || shotAt(t));
  if (shot) { camera.fov = shot.fov; camera.position.copy(shot.pos); camera.lookAt(shot.tgt); camera.updateProjectionMatrix(); }
  else controls.update();
  if (FAST) {
    animate(t);
    renderer.shadowMap.needsUpdate = true;
    renderer.render(scene, camera);
  } else {
    for (let k = 0; k < SAMPLES; k++) {
      const ts = t + k / SAMPLES * SHUTTER;
      if (k) advance(ts);
      animate(ts);
      if (SAMPLES > 1) {
        const j = JITTER[k];
        if (shot) {
          camera.position.copy(shot.pos); camera.lookAt(shot.tgt); camera.updateMatrixWorld();
          camRight.setFromMatrixColumn(camera.matrixWorld, 0); camUp.setFromMatrixColumn(camera.matrixWorld, 1);
          camera.position.addScaledVector(camRight, j.lx * shot.aperture).addScaledVector(camUp, j.ly * shot.aperture);
          camera.lookAt(shot.tgt);
        }
        camera.setViewOffset(BW, BH, j.px, j.py, BW, BH);
        key.position.set(LAMP.x + j.sx * LAMP_R, LAMP.y, LAMP.z + j.sz * LAMP_R);
      }
      gtao.gtaoMaterial.uniforms.tNoise.value = AO_NOISE[k][0]; gtao.pdMaterial.uniforms.tNoise.value = AO_NOISE[k][1];
      renderer.shadowMap.needsUpdate = true;
      composerA.render();
      accumQuad.material.uniforms.tDiffuse.value = composerA.readBuffer.texture;
      accumQuad.material.uniforms.opacity.value = 1 / (k + 1);
      renderer.setRenderTarget(accumRT);
      renderer.autoClear = false; accumQuad.render(renderer); renderer.autoClear = true;
      renderer.setRenderTarget(null);
    }
    lens.uniforms.time.value = t;
    composerB.render();
  }
  overlays(freeCam ? -1 : t);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  BW = size.x; BH = size.y;
  composerA.setSize(BW, BH); composerB.setSize(BW, BH); accumRT.setSize(BW, BH);
  gtao.setSize(Math.ceil(BW / 2), Math.ceil(BH / 2));     // occlusion is soft: half the pixels will do
  camera.aspect = w / h;
  // keep the shots framed on a narrow screen
  camera.zoom = Math.min(1, (w / h) / (16 / 9) * 1.15);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// first the screens (they are lights too), then the light that bounces
advance(0); animate(0); drawScreens(0);
bakeEnvironment();

// ----------------------------------------------------------------- playing
if (RECORD) {
  window.__demo = { duration: DURATION, samples: SAMPLES, render: t => { renderAt(t); return true; } };
  renderAt(0);
  window.__demoReady = true;
} else {
  let playing = true, clock = Number(params.get('t')) || 0, last = performance.now();
  const playBtn = document.getElementById('play');
  const freeBtn = document.getElementById('free');
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; playBtn.setAttribute('aria-pressed', String(!playing)); };
  document.getElementById('restart').onclick = () => { clock = 0; };
  freeBtn.onclick = () => {
    freeCam = !freeCam;
    freeBtn.setAttribute('aria-pressed', String(freeCam));
    if (freeCam) {
      controls = controls || new OrbitControls(camera, canvas);
      controls.enabled = true;
      controls.target.copy(shotAt(clock).tgt);
      controls.minDistance = 0.4; controls.maxDistance = 4.5;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.enableDamping = true;
    } else if (controls) controls.enabled = false;
  };
  const tick = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) { clock += dt; if (clock > DURATION) clock = 0; }
    renderAt(clock);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
