[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "walka"
version = "0.1.0"
description = "Walka companion: links an under-desk walking pad to World of Warcraft (and other games)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    # 3.1 fixes WinRT errors on disconnect and on fast reconnects.
    "bleak>=3.1,<4",
    "mss>=10.2,<11",  # 11 changes the capture API
    # bleak 3.1 is developed against the 3.x Windows Runtime bindings; the
    # 4.x series (October 2026) renamed APIs and cannot be mixed with 3.x.
    "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "lupa>=2.2",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
walka = "walka.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/walka"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]
