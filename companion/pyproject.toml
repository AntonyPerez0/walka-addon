[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "walka"
version = "0.12.0"
description = "Walka companion for Windows and macOS: records your walks on an under-desk walking pad while you play World of Warcraft. It sends the pad no commands."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9",
    # 3.1 fixes WinRT errors on disconnect and on fast reconnects.
    "bleak>=3.1,<4",
    # Walka's own window (walka.window): shows the dashboard with what the
    # system has for it - Edge WebView2 on Windows, WebKit on a Mac. Where
    # it is not installed (Linux), the dashboard opens in the browser.
    "pywebview>=6.2,<7; sys_platform == 'win32' or sys_platform == 'darwin'",
    # bleak 3.1 is developed against the 3.x Windows Runtime bindings; the
    # 4.x series (October 2026) renamed APIs and cannot be mixed with 3.x.
    "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.Advertisement>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Enumeration>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Devices.Radios>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2,<4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    # pywebview needs proxy_tools, which is published as source only: pip
    # builds it where it installs it, with setuptools. Named here so that
    # the lock files pin the setuptools that does (--build-constraint).
    "setuptools>=77",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "lupa>=2.2",
    "ruff>=0.6",
]
build = [
    "setuptools>=77",  # (see "dev")
    "pyinstaller>=6.9",
]

[project.scripts]
walka = "walka.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/walka"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP042 (StrEnum) would change what str() of a member gives; UP047 only
# respells generics.
ignore = ["E501", "UP007", "UP045", "UP042", "UP047"]
